          '<div><strong>วันที่ขอ:</strong> ' + this.escapeHtml(this.formatDateText(row.REQUESTED_AT || row.CREATED_AT)) + '</div></div>' +
          '<div class="form-group mt"><label for="reject_' + this.escapeAttr(id) + '">เหตุผลกรณีไม่อนุมัติ</label><textarea id="reject_' +
          this.escapeAttr(id) + '" rows="2" maxlength="1500"></textarea></div>' +
          '<div class="button-row"><button class="btn btn-success" type="button" onclick="App.approveRegistration(\'' + this.escapeAttr(id) + '\')">อนุมัติเป็น USER</button>' +
          '<button class="btn btn-danger" type="button" onclick="App.rejectRegistration(\'' + this.escapeAttr(id) + '\')">ไม่อนุมัติ</button></div></div>';
      }).join('');
    },

    async approveRegistration(registrationId) {
      const row = this.registrationRows.find((item) => String(item.REGISTRATION_ID) === String(registrationId));
      const confirmed = await this.confirmBox({
        title: 'อนุมัติสมาชิกใหม่?',
        message: 'ระบบจะสร้างบัญชี FRS และกำหนด Role เริ่มต้นเป็น USER',
        detail: row ? ((row.FULL_NAME || '') + '\n' + (row.EMAIL || '')) : registrationId,
        confirmText: 'อนุมัติสมาชิก',
        cancelText: 'ยกเลิก'
      });
      if (!confirmed) return;
      this.showLoading(true);
      try {
        const res = await this.serverCall((runner) => runner.apiApproveRegistration(this.token, { registrationId: registrationId }));
        if (!res || !res.ok) {
          this.handleApiError(res);
          return;
        }
        await this.loadRegistrations(false);
        await this.notify(res.message, 'success');
      } catch (err) {
        this.notify((err && err.message) || 'อนุมัติสมาชิกไม่สำเร็จ', 'error');
      } finally {
        this.showLoading(false);
      }
    },

    async rejectRegistration(registrationId) {
      const reasonElement = document.getElementById('reject_' + registrationId);
      const reason = reasonElement ? reasonElement.value.trim() : '';
      if (!reason) {
        this.notify('กรุณากรอกเหตุผลการไม่อนุมัติ', 'warning');
        return;
      }
      const confirmed = await this.confirmBox({
        title: 'ไม่อนุมัติคำขอนี้?',
        message: 'เหตุผลจะถูกบันทึกในประวัติคำขอสมัครสมาชิก',
        detail: reason,
        confirmText: 'ยืนยันไม่อนุมัติ',
        cancelText: 'กลับไป',
        type: 'warning'
      });
      if (!confirmed) return;
      this.showLoading(true);
      try {
        const res = await this.serverCall((runner) => runner.apiRejectRegistration(this.token, {
          registrationId: registrationId,
          reason: reason
        }));
        if (!res || !res.ok) {
          this.handleApiError(res);
          return;
        }
        await this.loadRegistrations(false);
        await this.notify(res.message, 'success');
      } catch (err) {
        this.notify((err && err.message) || 'บันทึกการไม่อนุมัติไม่สำเร็จ', 'error');
      } finally {
        this.showLoading(false);
      }
    },

    acquireActionLock(name) {
      const key = String(name || 'action');
      if (this.actionLocks[key]) return false;
      this.actionLocks[key] = true;
      return true;
    },

    releaseActionLock(name) {
      delete this.actionLocks[String(name || 'action')];
    },

    setButtonBusy(buttonOrId, busy, busyLabel) {
      const button = typeof buttonOrId === 'string' ? document.getElementById(buttonOrId) : buttonOrId;
      if (!button) return;
      if (!button.dataset.defaultLabel) button.dataset.defaultLabel = button.textContent.trim();
      button.disabled = Boolean(busy);
      button.classList.toggle('is-busy', Boolean(busy));
      button.setAttribute('aria-busy', busy ? 'true' : 'false');
      button.textContent = busy ? (busyLabel || 'กำลังดำเนินการ...') : button.dataset.defaultLabel;
    },

    createClientRequestId(prefix) {
      const random = (window.crypto && typeof window.crypto.getRandomValues === 'function')
        ? Array.from(window.crypto.getRandomValues(new Uint32Array(2))).map((value) => value.toString(16)).join('')
        : Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
      return String(prefix || 'ACT') + '-' + Date.now().toString(36) + '-' + random;
    },

    findMasterLabel(collectionName, valueField, labelField, value) {
      const rows = (this.master && this.master[collectionName]) || [];
      const row = rows.find((item) => String(item[valueField]) === String(value));
      return row ? (row[labelField] || value) : value;
    },

    showRequestPreview(payload) {
      const modal = document.getElementById('requestPreviewModal');
      if (!modal) return Promise.resolve(true);

      const setText = (id, value) => {
        const element = document.getElementById(id);
        if (element) element.textContent = value || '-';
      };
      setText('previewSystem', this.findMasterLabel('systems', 'SYSTEM_CODE', 'SYSTEM_NAME_TH', payload.SYSTEM_CODE));
      setText('previewLocation', this.findMasterLabel('locations', 'LOCATION_ID', 'LOCATION_FULL', payload.LOCATION_ID));
      setText('previewPriority', this.findMasterLabel('sla', 'PRIORITY_CODE', 'PRIORITY_NAME_TH', payload.PRIORITY_CODE));
      setText('previewPhone', payload.PHONE ? this.formatThaiPhoneDisplay(payload.PHONE) : 'ไม่ระบุ');
      setText('previewProblem', payload.PROBLEM_DETAIL);
      setText('previewRemark', payload.REMARK || '');

      const remarkBlock = document.getElementById('previewRemarkBlock');
      if (remarkBlock) remarkBlock.classList.toggle('hidden', !payload.REMARK);
      const photoBlock = document.getElementById('previewPhotoBlock');
      const photo = document.getElementById('previewPhoto');
      if (photoBlock) photoBlock.classList.toggle('hidden', !payload.PHOTO_BASE64);
      if (photo) photo.style.backgroundImage = payload.PHOTO_BASE64 ? 'url("' + payload.PHOTO_BASE64 + '")' : '';

      modal.classList.remove('hidden');
      document.body.classList.add('modal-open');
      const confirmButton = document.getElementById('requestPreviewConfirmButton');
      setTimeout(() => { if (confirmButton) confirmButton.focus(); }, 30);

      return new Promise((resolve) => {
        this.requestPreviewResolver = resolve;
      });
    },

    resolveRequestPreview(result) {
      const modal = document.getElementById('requestPreviewModal');
      if (modal) modal.classList.add('hidden');
      document.body.classList.remove('modal-open');
      const resolver = this.requestPreviewResolver;
      this.requestPreviewResolver = null;
      if (resolver) resolver(Boolean(result));
    },

    renderRequestListSkeleton(containerId, count) {
      const container = document.getElementById(containerId);
      if (!container) return;
      const total = Math.max(1, Number(count || 4));
      container.innerHTML = Array.from({ length: total }, () =>
        '<div class="skeleton-card" aria-hidden="true"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div><div class="skeleton-line"></div></div>'
      ).join('');
    },

    renderDashboardSkeleton() {
      const panel = document.getElementById('dashboardTab');
      if (panel) panel.classList.add('panel-loading');
      const latest = document.getElementById('latestList');
      if (latest && !this.lastLoaded.dashboard) this.renderRequestListSkeleton('latestList', 3);
    },

    async submitRequest(event) {
      if (event) event.preventDefault();
      if (!this.acquireActionLock('createRequest')) {
        this.notify('ระบบกำลังประมวลผลรายการเดิม กรุณารอสักครู่', 'warning', 'กำลังบันทึกข้อมูล');
        return;
      }

      const submitButton = (event && event.submitter) || document.getElementById('requestSubmitButton');
      this.setButtonBusy(submitButton, true, 'กำลังตรวจสอบ...');
      let loadingShown = false;

      try {
        const phoneValue = this.validateThaiPhoneField('PHONE', true);
        if (phoneValue === null) {
          const phoneInput = document.getElementById('PHONE');
          if (phoneInput) phoneInput.focus();
          await this.notify('กรุณาตรวจสอบรูปแบบเบอร์โทรศัพท์ หรือเว้นว่างหากไม่ต้องการระบุ', 'warning', 'เบอร์โทรไม่ถูกต้อง');
          return;
        }

        const systemInput = document.getElementById('SYSTEM_CODE');
        const locationInput = document.getElementById('LOCATION_ID');
        const priorityInput = document.getElementById('PRIORITY_CODE');
        const problemInput = document.getElementById('PROBLEM_DETAIL');
        const remarkInput = document.getElementById('REMARK');

        if (!systemInput || !locationInput || !priorityInput || !problemInput || !remarkInput) {
          throw new Error('โครงสร้างแบบฟอร์มแจ้งซ่อมไม่ครบ กรุณาโหลดหน้าใหม่');
        }

        const payload = {
          SYSTEM_CODE: systemInput.value,
          LOCATION_ID: locationInput.value,
          PRIORITY_CODE: priorityInput.value,
          PROBLEM_DETAIL: problemInput.value.trim(),
          PHONE: phoneValue,
          PHOTO_BASE64: this.photoBase64,
          REMARK: remarkInput.value.trim()
        };

        if (!payload.SYSTEM_CODE || !payload.LOCATION_ID || !payload.PRIORITY_CODE || !payload.PROBLEM_DETAIL) {
          await this.notify('กรุณากรอกข้อมูลที่มีเครื่องหมาย * ให้ครบ', 'warning', 'ข้อมูลยังไม่ครบ');
          return;
        }

        this.setButtonBusy(submitButton, true, 'รอยืนยันข้อมูล...');
        const confirmed = await this.showRequestPreview(payload);
        if (!confirmed) return;
        if (!this.pendingRequestClientId) this.pendingRequestClientId = this.createClientRequestId('REQ');
        payload.CLIENT_REQUEST_ID = this.pendingRequestClientId;

        this.setButtonBusy(submitButton, true, 'กำลังส่งแจ้งซ่อม...');
        this.showLoading(true);
        loadingShown = true;
        const res = await this.serverCall((runner) => runner.apiCreateRequest(this.token, payload));
        if (!res || !res.ok) {
          this.handleApiError(res);
          return;
        }

        const duplicateText = res.data && res.data.duplicate ? ' (ระบบตรวจพบการส่งซ้ำและใช้รายการเดิม)' : '';
        await this.notify('สร้างรายการแจ้งซ่อมเลขที่ ' + res.data.requestId + ' เรียบร้อยแล้ว' + duplicateText, 'success', 'ส่งแจ้งซ่อมสำเร็จ');
        this.resetRequestForm();
        this.invalidateTabs('dashboard', 'myRequests');
        await Promise.all([this.loadDashboard(false), this.loadRequests(false, true)]);
        this.showTab('myRequests', false);
      } catch (err) {
        console.error('SUBMIT_REQUEST', err);
        await this.notify(this.clientErrorMessage(err, 'บันทึกไม่สำเร็จ'), 'error', 'ส่งแจ้งซ่อมไม่สำเร็จ');
      } finally {
        if (loadingShown) this.showLoading(false);
        this.resolveRequestPreview(false);
        this.setButtonBusy(submitButton, false);
        this.releaseActionLock('createRequest');
      }
    },

    resetRequestForm() {
      const form = document.getElementById('requestForm');
      if (form) form.reset();
      const phoneInput = document.getElementById('PHONE');
      if (phoneInput) phoneInput.value = '';
      this.clearThaiPhoneError('PHONE');
      this.clearSelectFilters();
      this.pendingRequestClientId = '';
      this.photoBase64 = '';
      document.getElementById('photoPreview').classList.add('hidden');
      document.getElementById('photoPreview').style.backgroundImage = '';
      document.getElementById('photoInfo').textContent = '';
    },

    bindPhotoInput() {
      const input = document.getElementById('PHOTO_FILE');
      if (!input) return;
      input.addEventListener('change', async (event) => {
        const result = await this.processPhotoInput(event.target, 'photoInfo', 'photoPreview');
        this.photoBase64 = result || '';
      });
    },

    async processPhotoInput(input, infoId, previewId) {
      const file = input.files && input.files[0];
      const info = document.getElementById(infoId);
      const preview = document.getElementById(previewId);
      if (!file) {
        if (info) info.textContent = '';
        if (preview) preview.classList.add('hidden');
        return '';
      }

      const allowed = ['image/jpeg', 'image/png', 'image/webp'];
      if (allowed.indexOf(file.type) === -1) {
        this.notify('รองรับเฉพาะ JPG, PNG และ WEBP หากเป็น HEIC ให้แปลงเป็น JPG ก่อน', 'warning', 'ชนิดไฟล์ไม่รองรับ');
        input.value = '';
        return '';
      }
      if (file.size > 15 * 1024 * 1024) {
        this.notify('ไฟล์ต้นฉบับต้องไม่เกิน 15 MB', 'warning', 'ไฟล์มีขนาดใหญ่เกินไป');
        input.value = '';
        return '';
      }

      this.showLoading(true);
      try {
        const result = await this.compressImage(file, 1600, 0.82, 2 * 1024 * 1024);
        if (info) info.textContent = 'ขนาดหลังย่อ: ' + this.formatBytes(result.bytes) + ' (' + result.width + ' × ' + result.height + ' px)';
        if (preview) {
          preview.style.backgroundImage = 'url("' + result.dataUrl + '")';
          preview.classList.remove('hidden');
        }
        return result.dataUrl;
      } catch (err) {
        input.value = '';
        this.notify(err.message || 'ไม่สามารถประมวลผลรูปภาพได้', 'error', 'ประมวลผลรูปภาพไม่สำเร็จ');
        return '';
      } finally {
        this.showLoading(false);
      }
    },

    compressImage(file, maxDimension, initialQuality, maxBytes) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('ไม่สามารถอ่านไฟล์รูปภาพได้'));
        reader.onload = () => {
          const image = new Image();
          image.onerror = () => reject(new Error('Browser ไม่รองรับรูปภาพนี้ กรุณาใช้ JPG, PNG หรือ WEBP'));
          image.onload = () => {
            let width = image.naturalWidth || image.width;
            let height = image.naturalHeight || image.height;
            const scale = Math.min(1, maxDimension / Math.max(width, height));
            width = Math.max(1, Math.round(width * scale));
            height = Math.max(1, Math.round(height * scale));

            let quality = initialQuality;
            let dataUrl = '';
            let bytes = 0;

            for (let attempt = 0; attempt < 8; attempt++) {
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const context = canvas.getContext('2d', { alpha: false });
              context.fillStyle = '#ffffff';
              context.fillRect(0, 0, width, height);
              context.drawImage(image, 0, 0, width, height);
              dataUrl = canvas.toDataURL('image/jpeg', quality);
              bytes = this.estimateDataUrlBytes(dataUrl);

              if (bytes <= maxBytes) break;
              quality = Math.max(0.58, quality - 0.06);
              width = Math.max(640, Math.round(width * 0.88));
              height = Math.max(480, Math.round(height * 0.88));
            }

            if (bytes > maxBytes) {
              reject(new Error('รูปภาพยังมีขนาดใหญ่เกินไป กรุณาเลือกรูปความละเอียดต่ำลง'));
              return;
            }
            resolve({ dataUrl: dataUrl, bytes: bytes, width: width, height: height });
          };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    },

    estimateDataUrlBytes(dataUrl) {
      const comma = dataUrl.indexOf(',');
      const base64 = comma === -1 ? dataUrl : dataUrl.slice(comma + 1);
      return Math.ceil(base64.length * 0.75);
    },

    formatBytes(bytes) {
      if (!bytes) return '0 KB';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    },

    applyRequestFilters() {
      const search = String(document.getElementById('requestSearch').value || '').trim().toLowerCase();
      const status = document.getElementById('requestStatusFilter').value;
      const filtered = this.requestRows.filter((row) => {
        if (status && String(row.STATUS_CODE) !== String(status)) return false;
        if (!search) return true;
        const haystack = [
          row.REQUEST_ID, row.PROBLEM_DETAIL, row.SYSTEM_NAME_TH, row.LOCATION_FULL,
          row.REQUESTER_NAME, row.ASSIGNED_TO_NAME, row.STATUS_NAME_TH
        ].join(' ').toLowerCase();
        return haystack.indexOf(search) !== -1;
      });
      this.renderRequestList('myRequestList', filtered);
    },

    getProgressData(row) {
      if (row && row.PROGRESS && typeof row.PROGRESS === 'object') return row.PROGRESS;
      const status = String((row && row.STATUS_CODE) || 'NEW').trim().toUpperCase();
      const map = {
        NEW: { percent: 10, step: 1, tone: 'new' },
        RECEIVED: { percent: 25, step: 2, tone: 'received' },
        ASSIGNED: { percent: 40, step: 3, tone: 'assigned' },
        IN_PROGRESS: { percent: 70, step: 4, tone: 'working' },
        WAITING_PART: { percent: 65, step: 4, tone: 'waiting' },
        OUTSOURCE: { percent: 65, step: 4, tone: 'outsource' },
        DONE: { percent: 90, step: 4, tone: 'done' },
        CLOSED: { percent: 100, step: 5, tone: 'closed' },
        CANCELLED: { percent: 0, step: 0, tone: 'cancelled' }
      };
      const meta = map[status] || map.NEW;
      const labels = ['แจ้งซ่อม', 'รับเรื่อง', 'มอบหมายช่าง', 'กำลังดำเนินการ', 'ปิดงาน'];
      return {
        percent: meta.percent,
        step: meta.step,
        tone: meta.tone,
        isCancelled: status === 'CANCELLED',
        steps: labels.map((label, index) => {
          const no = index + 1;
          return { number: no, label: label, state: no < meta.step ? 'completed' : (no === meta.step ? 'active' : 'pending') };
        }),
        subProgress: []
      };
    },

    renderCompactProgress(row) {
      const progress = this.getProgressData(row);
      const percent = Math.max(0, Math.min(100, Number(progress.percent || 0)));
      const tone = this.escapeAttr(progress.tone || 'new');
      const label = progress.isCancelled ? 'ยกเลิกงาน' : 'ความคืบหน้า ' + percent + '%';
      return '<div class="frs-progress-compact frs-tone-' + tone + '">' +
        '<div class="frs-progress-compact__head"><span>' + this.escapeHtml(label) + '</span><strong>' + percent + '%</strong></div>' +
        '<div class="frs-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + percent + '">' +
          '<span class="frs-progress-fill" style="width:' + percent + '%"></span>' +
        '</div>' +
      '</div>';
    },

    renderProgressOverview(row) {
      const progress = this.getProgressData(row);
      const percent = Math.max(0, Math.min(100, Number(progress.percent || 0)));
      const steps = progress.steps || [];
      const subtasks = progress.subProgress || [];
      const tone = this.escapeAttr(progress.tone || 'new');

      const stepHtml = steps.map((step, index) => {
        const state = step.state || 'pending';
        const symbol = state === 'completed' ? '&#10003;' : this.escapeHtml(step.number);
        return '<div class="frs-step frs-step--' + this.escapeAttr(state) + '">' +
          '<div class="frs-step__node">' + symbol + '</div>' +
          '<div class="frs-step__label">' + this.escapeHtml(step.label) + '</div>' +
          (index < steps.length - 1 ? '<div class="frs-step__connector"></div>' : '') +
        '</div>';
      }).join('');

      const subHtml = subtasks.length ? '<div class="frs-subprogress">' + subtasks.map((item) => {
        const value = Math.max(0, Math.min(100, Number(item.percent || 0)));
        return '<div class="frs-subprogress__row"><span>' + this.escapeHtml(item.label) + '</span>' +
          '<div class="frs-subprogress__track"><i style="width:' + value + '%"></i></div><strong>' + value + '%</strong></div>';
      }).join('') + '</div>' : '';

      return '<section class="frs-progress-overview frs-tone-' + tone + '" aria-label="ความคืบหน้างานแจ้งซ่อม">' +
        '<div class="frs-progress-overview__head"><div><div class="frs-progress-eyebrow">ความคืบหน้ารวมของงาน</div>' +
          '<div class="frs-progress-status">' + this.escapeHtml(row.STATUS_NAME_TH || row.STATUS_CODE || '') + '</div></div>' +
          '<div class="frs-progress-percent">' + percent + '%</div></div>' +
        '<div class="frs-progress-track frs-progress-track--large"><span class="frs-progress-fill" style="width:' + percent + '%"></span></div>' +
        '<div class="frs-steps">' + stepHtml + '</div>' + subHtml +
      '</section>';
    },

    renderRequestList(containerId, rows) {
      const element = document.getElementById(containerId);
      if (!element) return;

      if (!rows || rows.length === 0) {
        element.innerHTML = '<div class="request-card"><div class="request-meta">ยังไม่มีรายการ</div></div>';
        return;
      }

      element.innerHTML = rows.map((row) => {
        const dateText = this.formatDateText(row.REQUEST_DATE || row.CREATED_AT);
        const statusCode = row.STATUS_CODE || '';
        const assignee = row.ASSIGNED_TO_NAME || '';
        return '<article class="request-card clickable" role="button" tabindex="0" data-request-id="' + this.escapeAttr(row.REQUEST_ID || '') + '">' +
          '<div class="request-card-header">' +
            '<div class="request-id frs-request-id-with-icon">' + this.iconSvg('file-text') + '<span>' + this.escapeHtml(row.REQUEST_ID || '') + '</span></div>' +
            '<div class="badge ' + this.escapeAttr(statusCode) + '">' + this.escapeHtml(row.STATUS_NAME_TH || statusCode) + '</div>' +
          '</div>' +
          '<div class="request-detail">' + this.escapeHtml(row.PROBLEM_DETAIL || '') + '</div>' +
          '<div class="request-meta">' +
            'ระบบ: ' + this.escapeHtml(row.SYSTEM_NAME_TH || '') + '<br>' +
            'สถานที่: ' + this.escapeHtml(row.LOCATION_FULL || '') + '<br>' +
            'วันที่แจ้ง: ' + this.escapeHtml(dateText) +
          '</div>' +
          (assignee ? '<div class="request-assignee">ผู้รับผิดชอบ: ' + this.escapeHtml(assignee) + '</div>' : '') +
          this.renderCompactProgress(row) +
        '</article>';
      }).join('');

      element.querySelectorAll('[data-request-id]').forEach((card) => {
        const open = () => this.openRequest(card.getAttribute('data-request-id'));
        card.addEventListener('click', open);
        card.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            open();
          }
        });
      });
    },

    async openRequest(requestId) {
      this.showLoading(true);
      try {
        const res = await this.serverCall((runner) => runner.apiGetRequestDetail(this.token, requestId));
        if (!res || !res.ok) {
          this.handleApiError(res);
          return;
        }
        this.currentDetail = res.data;
        this.renderRequestDetail();
        document.getElementById('requestModal').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      } catch (err) {
        this.notify((err && err.message) || 'เปิดรายละเอียดไม่สำเร็จ', 'error', 'เปิดรายการไม่สำเร็จ');
      } finally {
        this.showLoading(false);
      }
    },

    closeRequestModal() {
      document.getElementById('requestModal').classList.add('hidden');
      document.body.style.overflow = '';
      this.currentDetail = null;
      this.repairPhotos = { before: '', after: '' };
    },

    renderRequestDetail() {
      if (!this.currentDetail) return;
      const row = this.currentDetail.request || {};
      document.getElementById('requestModalTitle').textContent = row.REQUEST_ID || 'รายละเอียดงาน';
      document.getElementById('requestModalSubtitle').textContent = (row.STATUS_NAME_TH || row.STATUS_CODE || '') +
        (row.ASSIGNED_TO_NAME ? ' | ' + row.ASSIGNED_TO_NAME : '');

      const fields = [
        ['ผู้แจ้ง', row.REQUESTER_NAME],
        ['เบอร์โทร', row.PHONE],
        ['ฝ่าย/แผนก', [row.DIVISION, row.DEPARTMENT].filter(Boolean).join(' / ')],
        ['วันที่แจ้ง', this.formatDateText(row.REQUEST_DATE)],
        ['ระบบ/อุปกรณ์', row.SYSTEM_NAME_TH],
        ['สถานที่', row.LOCATION_FULL],
        ['ความเร่งด่วน', row.PRIORITY_NAME_TH + (row.SLA_HOURS ? ' (SLA ' + row.SLA_HOURS + ' ชม.)' : '')],
        ['ผู้รับผิดชอบ', row.ASSIGNED_TO_NAME || 'ยังไม่ได้มอบหมาย'],
        ['เริ่มดำเนินการ', this.formatDateText(row.FIX_START_DATE)],
        ['เสร็จสิ้น', this.formatDateText(row.FIX_DONE_DATE)],
        ['ระยะเวลาดำเนินงาน', row.DURATION_HOURS !== '' && row.DURATION_HOURS !== null ? row.DURATION_HOURS + ' ชั่วโมง' : '-'],
        ['ผล SLA', row.SLA_RESULT || '-'],
        ['รายละเอียดปัญหา', row.PROBLEM_DETAIL],
        ['วิธีแก้ไข/ผลดำเนินงาน', row.SOLUTION_DETAIL || '-'],
        ['ค่าใช้จ่าย', this.formatMoney(row.COST)],
        ['หมายเหตุ', row.REMARK || '-']
      ];

      let html = this.renderProgressOverview(row) + '<div class="detail-card"><div class="detail-grid">' + fields.map((field) =>
        '<div class="detail-item"><span class="detail-label">' + this.escapeHtml(field[0]) + '</span>' +
        '<div class="detail-value">' + this.escapeHtml(field[1] === undefined || field[1] === null || field[1] === '' ? '-' : field[1]) + '</div></div>'
      ).join('') + '</div>';

      const photos = [
        ['รูปแจ้งซ่อม', row.PHOTO_REQUEST_URL],
        ['รูปก่อนดำเนินการ', row.PHOTO_BEFORE_FIX_URL],
        ['รูปหลังดำเนินการ', row.PHOTO_AFTER_FIX_URL]
      ].filter((item) => item[1]);
      if (photos.length) {
        html += '<div class="photo-links">' + photos.map((item) =>
          '<a class="photo-link" href="' + this.escapeAttr(this.safeUrl(item[1])) + '" target="_blank" rel="noopener noreferrer">' + this.escapeHtml(item[0]) + '</a>'
        ).join('') + '</div>';
      }
      html += '</div>';
      document.getElementById('requestDetailContent').innerHTML = html;

      this.renderWorkflowActions();
      this.renderTimeline(this.currentDetail.logs || []);
    },

    renderTimeline(logs) {
      const container = document.getElementById('statusTimeline');
      if (!logs.length) {
        container.innerHTML = '<div class="request-card"><div class="request-meta">ยังไม่มีประวัติ</div></div>';
        return;
      }
      container.innerHTML = logs.map((log) => {
        const newStatus = log.NEW_STATUS_CODE || '-';
        const statusName = this.getStatusName(newStatus);
        return '<div class="timeline-item">' +
          '<div class="timeline-title frs-title-with-icon"><span class="frs-timeline-icon">' + this.iconSvg(this.statusIconName(newStatus)) + '</span><span>' + this.escapeHtml(statusName) + '</span></div>' +
          '<div class="timeline-meta">' + this.escapeHtml(log.ACTION_NAME || log.ACTION_BY || '-') + ' | ' + this.escapeHtml(this.formatDateText(log.ACTION_DATE)) + '</div>' +
          (log.NOTE ? '<div class="timeline-note">' + this.escapeHtml(log.NOTE) + '</div>' : '') +
        '</div>';
      }).join('');
    },

    renderWorkflowActions() {
      const container = document.getElementById('workflowActions');
      const actions = (this.currentDetail && this.currentDetail.allowedActions) || {};
      const request = (this.currentDetail && this.currentDetail.request) || {};
      const technicians = (this.currentDetail && this.currentDetail.technicians) || [];
      const blocks = [];

      if (actions.receive || actions.claim || actions.start || actions.resume) {
        const buttons = [];
        if (actions.receive) buttons.push('<button class="btn btn-primary" type="button" onclick="App.receiveCurrent()">รับเรื่อง</button>');
        if (actions.claim) buttons.push('<button class="btn btn-success" type="button" onclick="App.claimCurrent()">รับงานนี้</button>');
        if (actions.start) buttons.push('<button class="btn btn-success" type="button" onclick="App.startCurrent()">เริ่มดำเนินการ</button>');
        if (actions.resume) buttons.push('<button class="btn btn-success" type="button" onclick="App.startCurrent()">กลับมาดำเนินการต่อ</button>');
        blocks.push('<div class="action-card"><div class="action-title">ดำเนินงาน</div><div class="button-row">' + buttons.join('') + '</div></div>');
      }

      if (actions.assign) {
        const options = ['<option value="">เลือกช่างผู้รับผิดชอบ</option>'].concat(technicians.map((tech) =>
          '<option value="' + this.escapeAttr(tech.USER_ID) + '"' + (String(request.ASSIGNED_TO) === String(tech.USER_ID) ? ' selected' : '') + '>' +
          this.escapeHtml(tech.FULL_NAME + (tech.POSITION ? ' - ' + tech.POSITION : '')) + '</option>'
        ));
        blocks.push('<div class="action-card"><div class="action-title">มอบหมาย / ส่งต่องาน</div>' +
          '<div class="action-grid"><div><label for="assignTechnician">ช่างผู้รับผิดชอบ</label><select id="assignTechnician">' + options.join('') + '</select></div>' +
          '<div><label for="assignNote">หมายเหตุ</label><input id="assignNote" maxlength="1500"></div></div>' +
          '<div class="button-row"><button class="btn btn-primary" type="button" onclick="App.assignCurrent()">บันทึกการมอบหมาย</button></div></div>');
      }

      if (actions.waitingPart || actions.outsource) {
        const buttons = [];
        if (actions.waitingPart) buttons.push('<button class="btn btn-warning" type="button" onclick="App.setCurrentWorkStatus(\'WAITING_PART\')">รออะไหล่/จัดซื้อ</button>');
        if (actions.outsource) buttons.push('<button class="btn btn-warning" type="button" onclick="App.setCurrentWorkStatus(\'OUTSOURCE\')">ส่งซ่อมภายนอก</button>');
        blocks.push('<div class="action-card"><div class="action-title">พัก/ส่งต่องานภายนอก</div>' +
          '<label for="workStatusNote">รายละเอียดหรือเหตุผล <span class="required">*</span></label>' +
          '<textarea id="workStatusNote" rows="2" maxlength="1500"></textarea>' +
          '<div class="button-row">' + buttons.join('') + '</div></div>');
      }

      if (actions.complete) {
        blocks.push('<div class="action-card"><div class="action-title">บันทึกผลและดำเนินการเสร็จสิ้น</div>' +
          '<div class="form-group"><label for="completeSolution">วิธีการแก้ไข/ผลการดำเนินงาน <span class="required">*</span></label>' +
          '<textarea id="completeSolution" rows="4" maxlength="5000">' + this.escapeHtml(request.SOLUTION_DETAIL || '') + '</textarea></div>' +
          '<div class="form-group"><label for="completeCost">ค่าใช้จ่าย (บาท)</label><input id="completeCost" type="number" min="0" step="0.01" value="' + this.escapeAttr(request.COST === 0 || request.COST ? request.COST : '') + '"></div>' +
          '<div class="action-grid"><div class="form-group"><label for="beforePhotoFile">รูปก่อนดำเนินการ</label><input id="beforePhotoFile" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"><div id="beforePhotoInfo" class="field-help"></div><div id="beforePhotoPreview" class="photo-preview hidden"></div></div>' +
          '<div class="form-group"><label for="afterPhotoFile">รูปหลังดำเนินการ</label><input id="afterPhotoFile" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"><div id="afterPhotoInfo" class="field-help"></div><div id="afterPhotoPreview" class="photo-preview hidden"></div></div></div>' +
          '<div class="form-group"><label for="completeNote">หมายเหตุเพิ่มเติม</label><textarea id="completeNote" rows="2" maxlength="1500"></textarea></div>' +
          '<button class="btn btn-success btn-full" type="button" onclick="App.completeCurrent()">บันทึกและส่งตรวจสอบ</button></div>');
      }

      if (actions.close) {
        blocks.push('<div class="action-card"><div class="action-title">ตรวจสอบและปิดงาน</div>' +
          '<label for="closeNote">ผลการตรวจสอบ</label><textarea id="closeNote" rows="2" maxlength="1500"></textarea>' +
          '<div class="button-row"><button class="btn btn-success" type="button" onclick="App.closeCurrent()">ปิดงาน</button></div></div>');
      }

      if (actions.cancel) {
        blocks.push('<div class="action-card"><div class="action-title">ยกเลิกรายการ</div>' +
          '<label for="cancelNote">เหตุผลการยกเลิก <span class="required">*</span></label><textarea id="cancelNote" rows="2" maxlength="1500"></textarea>' +
          '<div class="button-row"><button class="btn btn-danger" type="button" onclick="App.cancelCurrent()">ยกเลิกงาน</button></div></div>');
      }

      container.innerHTML = blocks.length ? '<div class="section-title mt">การดำเนินงาน</div>' + blocks.join('') : '';
      this.repairPhotos = { before: '', after: '' };
      this.bindRepairPhotoInputs();
    },

    bindRepairPhotoInputs() {
      const beforeInput = document.getElementById('beforePhotoFile');
      const afterInput = document.getElementById('afterPhotoFile');
      if (beforeInput) {
        beforeInput.addEventListener('change', async (event) => {
          this.repairPhotos.before = await this.processPhotoInput(event.target, 'beforePhotoInfo', 'beforePhotoPreview') || '';
        });
      }
      if (afterInput) {
        afterInput.addEventListener('change', async (event) => {
          this.repairPhotos.after = await this.processPhotoInput(event.target, 'afterPhotoInfo', 'afterPhotoPreview') || '';
        });
      }
    },

    currentRequestId() {
      return this.currentDetail && this.currentDetail.request && this.currentDetail.request.REQUEST_ID;
    },

    async runWorkflow(invoker, confirmConfig) {
      if (confirmConfig) {
        const confirmed = await this.confirmBox(confirmConfig);
        if (!confirmed) return;
      }

      const requestId = this.currentRequestId();
      if (!requestId) {
        this.notify('ไม่พบเลขที่ใบแจ้งซ่อม กรุณาปิดหน้าต่างแล้วเปิดรายการใหม่', 'error', 'ไม่สามารถดำเนินการได้');
        return;
      }

      this.showLoading(true);
      let successMessage = '';
      try {
        const res = await this.serverCall(invoker);
        if (!res || !res.ok) {
          this.handleApiError(res);
          return;
        }
        successMessage = res.message || 'ดำเนินการเรียบร้อย';
        await Promise.all([this.loadDashboard(false), this.loadRequests(false)]);
        await this.openRequest(requestId);
      } catch (err) {
        this.notify((err && err.message) || 'ดำเนินการไม่สำเร็จ', 'error', 'เกิดข้อผิดพลาด');
      } finally {
        this.showLoading(false);
      }

      if (successMessage) {
        await this.notify(successMessage, 'success', 'บันทึกสำเร็จ');
      }
    },

    receiveCurrent() {
      const payload = { REQUEST_ID: this.currentRequestId(), NOTE: '' };
      return this.runWorkflow(
        (runner) => runner.apiReceiveRequest(this.token, payload),
        {
          title: 'รับเรื่องแจ้งซ่อม?',
          message: 'ระบบจะเปลี่ยนสถานะเป็น “รับเรื่องแล้ว” และบันทึกชื่อผู้ดำเนินการใน Timeline',
          detail: this.currentRequestId(),
          confirmText: 'รับเรื่อง',
          cancelText: 'ยกเลิก',
          type: 'question'
        }
      );
    },

    claimCurrent() {
      const payload = { REQUEST_ID: this.currentRequestId(), NOTE: '' };
      return this.runWorkflow(
        (runner) => runner.apiClaimRequest(this.token, payload),
        {
          title: 'รับงานนี้เป็นผู้รับผิดชอบ?',
          message: 'งานจะถูกมอบหมายให้คุณ และผู้ใช้งานคนอื่นจะเห็นชื่อคุณเป็นช่างผู้รับผิดชอบ',
          detail: this.currentRequestId(),
          confirmText: 'รับงานนี้',
          cancelText: 'ยกเลิก',
          type: 'question'
        }
      );
    },

    assignCurrent() {
      const select = document.getElementById('assignTechnician');
      const technicianId = select.value;
      const technicianName = select.options[select.selectedIndex] ? select.options[select.selectedIndex].text : technicianId;
      const note = document.getElementById('assignNote').value.trim();
      if (!technicianId) {
        this.notify('กรุณาเลือกช่างผู้รับผิดชอบก่อนบันทึกการมอบหมาย', 'warning', 'ยังไม่ได้เลือก Technician');
        return;
      }
      const payload = { REQUEST_ID: this.currentRequestId(), TECHNICIAN_ID: technicianId, NOTE: note };
      return this.runWorkflow(
        (runner) => runner.apiAssignRequest(this.token, payload),
        {
          title: 'ยืนยันการมอบหมายงาน?',
          message: 'รายการนี้จะถูกมอบหมายหรือส่งต่อให้ Technician ที่เลือก',
          detail: 'ผู้รับผิดชอบ: ' + technicianName + (note ? '\nหมายเหตุ: ' + note : ''),
          confirmText: 'มอบหมายงาน',
          cancelText: 'กลับไปแก้ไข',
          type: 'question'
        }
      );
    },

    startCurrent() {
      const payload = { REQUEST_ID: this.currentRequestId(), NOTE: '' };
      const status = this.currentDetail && this.currentDetail.request && this.currentDetail.request.STATUS_CODE;
      const resume = ['WAITING_PART', 'OUTSOURCE'].indexOf(String(status)) !== -1;
      return this.runWorkflow(
        (runner) => runner.apiStartRequest(this.token, payload),
        {
          title: resume ? 'กลับมาดำเนินการต่อ?' : 'เริ่มดำเนินการ?',
          message: resume
            ? 'ระบบจะเปลี่ยนสถานะกลับเป็น “กำลังดำเนินการ” และบันทึกเวลาเริ่มทำงานต่อ'
            : 'ระบบจะบันทึกเวลาเริ่มงานและเปลี่ยนสถานะเป็น “กำลังดำเนินการ”',
          detail: this.currentRequestId(),
          confirmText: resume ? 'ดำเนินการต่อ' : 'เริ่มงาน',
          cancelText: 'ยกเลิก',
          type: 'question'
        }
      );
    },

    setCurrentWorkStatus(statusCode) {
      const note = document.getElementById('workStatusNote').value.trim();
      if (!note) {
        this.notify('กรุณาระบุรายละเอียดหรือเหตุผลก่อนเปลี่ยนสถานะงาน', 'warning', 'ต้องระบุเหตุผล');
        return;
      }
      const statusName = statusCode === 'WAITING_PART' ? 'รออะไหล่/จัดซื้อ' : 'ส่งซ่อมภายนอก';
      const payload = { REQUEST_ID: this.currentRequestId(), STATUS_CODE: statusCode, NOTE: note };
      return this.runWorkflow(
        (runner) => runner.apiSetWorkStatus(this.token, payload),
        {
          title: 'เปลี่ยนสถานะเป็น “' + statusName + '”?',
          message: 'สถานะใหม่และเหตุผลจะถูกบันทึกใน Timeline ของงาน',
          detail: note,
          confirmText: 'ยืนยันสถานะ',
          cancelText: 'กลับไปแก้ไข',
          type: 'warning'
        }
      );
    },

    completeCurrent() {
      const solution = document.getElementById('completeSolution').value.trim();
      if (!solution) {
        this.notify('กรุณาระบุวิธีการแก้ไขหรือผลการดำเนินงาน', 'warning', 'ข้อมูลผลการซ่อมยังไม่ครบ');
        return;
      }
      const cost = document.getElementById('completeCost').value;
      const payload = {
        REQUEST_ID: this.currentRequestId(),
        SOLUTION_DETAIL: solution,
        COST: cost,
        NOTE: document.getElementById('completeNote').value.trim(),
        PHOTO_BEFORE_BASE64: this.repairPhotos.before,
        PHOTO_AFTER_BASE64: this.repairPhotos.after
      };
      return this.runWorkflow(
        (runner) => runner.apiCompleteRequest(this.token, payload),
        {
          title: 'ส่งงานให้ผู้ดูแลตรวจสอบ?',
          message: 'ระบบจะบันทึกผลการซ่อม ค่าใช้จ่าย รูปประกอบ และเปลี่ยนสถานะเป็น “ดำเนินการแล้วเสร็จ”',
          detail: 'ค่าใช้จ่าย: ' + this.formatMoney(cost || 0) + '\nผลการดำเนินงาน: ' + solution,
          confirmText: 'บันทึกและส่งตรวจ',
          cancelText: 'ตรวจสอบอีกครั้ง',
          type: 'question'
        }
      );
    },

    closeCurrent() {
      const note = document.getElementById('closeNote').value.trim();
      const payload = { REQUEST_ID: this.currentRequestId(), NOTE: note };
      return this.runWorkflow(
        (runner) => runner.apiCloseRequest(this.token, payload),
        {
          title: 'ปิดงานนี้?',
          message: 'หลังปิดงาน ระบบจะถือว่า Workflow เสร็จสมบูรณ์และไม่สามารถดำเนินการต่อในสถานะปกติได้',
          detail: note || this.currentRequestId(),
          confirmText: 'ยืนยันปิดงาน',
          cancelText: 'ยังไม่ปิด',
          type: 'warning'
        }
      );
    },

    cancelCurrent() {
      const note = document.getElementById('cancelNote').value.trim();
      if (!note) {
        this.notify('กรุณาระบุเหตุผลที่ต้องการยกเลิกรายการ', 'warning', 'ต้องระบุเหตุผล');
        return;
      }
      const payload = { REQUEST_ID: this.currentRequestId(), NOTE: note };
      return this.runWorkflow(
        (runner) => runner.apiCancelRequest(this.token, payload),
        {
          title: 'ยกเลิกรายการนี้?',
          message: 'สถานะจะเปลี่ยนเป็น “ยกเลิก” และเหตุผลจะถูกบันทึกถาวรใน Timeline',
          detail: note,
          confirmText: 'ยืนยันยกเลิกงาน',
          cancelText: 'กลับไป',
          type: 'error'
        }
      );
    },

    getStatusName(code) {
      const row = ((this.master && this.master.status) || []).find((item) => String(item.STATUS_CODE) === String(code));
      return row ? row.STATUS_NAME_TH : code;
    },

    formatDateText(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (isNaN(date.getTime())) return String(value);
      return date.toLocaleString('th-TH', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
      });
    },

    formatMoney(value) {
      if (value === '' || value === null || value === undefined) return '-';
      const number = Number(value);
      return isNaN(number) ? String(value) : number.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' บาท';
    },

    safeUrl(value) {
      const url = String(value || '');
      return /^https:\/\//i.test(url) ? url : '#';
    },

    showLoading(show) {
      this.loadingCount = Math.max(0, this.loadingCount + (show ? 1 : -1));
      document.getElementById('loadingOverlay').classList.toggle('hidden', this.loadingCount === 0);
    },

    notify(message, type = 'info', title = '', options = {}) {
      const titles = {
        success: 'ดำเนินการสำเร็จ',
        warning: 'กรุณาตรวจสอบ',
        error: 'เกิดข้อผิดพลาด',
        question: 'ยืนยันการดำเนินการ',
        info: 'ข้อความจากระบบ'
      };
      return this.showMessageBox(Object.assign({
        type: type,
        title: title || titles[type] || titles.info,
        message: String(message || ''),
        confirmText: 'ตกลง',
        showCancel: false
      }, options || {}));
    },

    confirmBox(config) {
      return this.showMessageBox(Object.assign({
        type: 'question',
        title: 'ยืนยันการดำเนินการ',
        message: '',
        confirmText: 'ยืนยัน',
        cancelText: 'ยกเลิก',
        showCancel: true
      }, config || {}, { showCancel: true }));
    },

    showMessageBox(config) {
      return new Promise((resolve) => {
        this.messageQueue.push({ config: config || {}, resolve: resolve });
        this.renderNextMessageBox();
      });
    },

    renderNextMessageBox() {
      if (this.messageActive || !this.messageQueue.length) return;

      const item = this.messageQueue.shift();
      const config = item.config || {};
      const type = ['success', 'warning', 'error', 'question', 'info'].indexOf(config.type) !== -1
        ? config.type
        : 'info';

      this.messageActive = item;
      this.messagePreviousFocus = document.activeElement;

      const box = document.getElementById('messageBox');
      const panel = box.querySelector('.msgbox-panel');
      const cancelButton = document.getElementById('messageBoxCancel');
      const confirmButton = document.getElementById('messageBoxConfirm');
      const closeButton = document.getElementById('messageBoxClose');
      const detail = document.getElementById('messageBoxDetail');
      const actions = box.querySelector('.msgbox-actions');

      panel.setAttribute('data-type', type);
      document.getElementById('messageBoxIcon').innerHTML = this.messageBoxIcon(type);
      document.getElementById('messageBoxEyebrow').textContent = this.messageBoxEyebrow(type);
      document.getElementById('messageBoxTitle').textContent = config.title || 'ข้อความจากระบบ';
      document.getElementById('messageBoxMessage').textContent = config.message || '';

      detail.textContent = config.detail || '';
      detail.classList.toggle('hidden', !config.detail);

      cancelButton.textContent = config.cancelText || 'ยกเลิก';
      cancelButton.classList.toggle('hidden', !config.showCancel);
      actions.classList.toggle('single-action', !config.showCancel);
      confirmButton.textContent = config.confirmText || 'ตกลง';
      closeButton.classList.toggle('hidden', config.showClose === false);

      box.classList.remove('hidden');
      document.body.classList.add('msgbox-open');
      setTimeout(() => confirmButton.focus(), 30);
    },

    resolveMessageBox(result) {
      if (!this.messageActive) return;
      const active = this.messageActive;
      this.messageActive = null;

      const box = document.getElementById('messageBox');
      box.classList.add('hidden');
      document.body.classList.remove('msgbox-open');

      if (this.messagePreviousFocus && typeof this.messagePreviousFocus.focus === 'function') {
        try { this.messagePreviousFocus.focus(); } catch (err) {}
      }
      this.messagePreviousFocus = null;
      active.resolve(Boolean(result));
      setTimeout(() => this.renderNextMessageBox(), 40);
    },

    dismissMessageBoxFromBackdrop() {
      if (!this.messageActive) return;
      const config = this.messageActive.config || {};
      if (config.backdropClose === false || config.showCancel) return;
      this.resolveMessageBox(false);
    },

    messageBoxEyebrow(type) {
      return {
        success: 'SUCCESS',
        warning: 'ATTENTION',
        error: 'ERROR',
        question: 'CONFIRM',
        info: 'INFORMATION'
      }[type] || 'FRS';
    },

    messageBoxIcon(type) {
      const icons = {
        success: 'check-circle',
        warning: 'alert',
        error: 'x',
        question: 'help',
        info: 'info'
      };
      return this.iconSvg(icons[type] || icons.info);
    },

    toast(message) {
      return this.notify(message, 'info');
    },

    escapeHtml(text) {
      return String(text === null || text === undefined ? '' : text).replace(/[&<>"']/g, function(char) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char];
      });
    },

    escapeAttr(text) {
      return this.escapeHtml(text).replace(/`/g, '&#096;');
    }
  };

  document.addEventListener('DOMContentLoaded', function() { App.init(); });
</script>
