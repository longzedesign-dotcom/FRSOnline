<script>
  const App = {
    sessionKey: 'FRS_SESSION_TOKEN',
    token: sessionStorage.getItem('FRS_SESSION_TOKEN') || '',
    currentUser: null,
    master: null,
    requestRows: [],
    currentDetail: null,
    photoBase64: '',
    repairPhotos: { before: '', after: '' },
    loadingCount: 0,
    toastTimer: null,
    messageQueue: [],
    messageActive: null,
    messagePreviousFocus: null,
    publicRegistrationData: null,
    publicRegistrationPromise: null,
    socialRegistrationContext: null,
    oauthResult: null,
    identities: [],
    registrationRows: [],
    socialAuthWindow: null,
    permissions: null,
    requestsLoaded: false,
    requestLoadPromise: null,
    actionLocks: Object.create(null),
    pendingRequestClientId: '',
    requestPreviewResolver: null,
    selectFilterTimers: Object.create(null),
    cacheTtlMs: 30000,
    currentDashboard: null,
    focusRequestId: '',
    themeKey: 'FRS_THEME',
    lastLoaded: { dashboard: 0, myRequests: 0, profile: 0, registrations: 0 },

    async init() {
      this.initTheme();
      this.bindWorkspaceShortcuts();
      this.bindGlobalErrorFeedback();
      this.bindOAuthCallbackMessage();
      this.consumeOAuthStorage();
      this.bindPhotoInput();
      this.bindSystemPriority();
      this.bindSearchableSelectFilters();
      this.bindPasswordVisibility();
      this.bindThaiPhoneInputs();
      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;
        const box = document.getElementById('messageBox');
        if (box && !box.classList.contains('hidden')) {
          this.resolveMessageBox(false);
          return;
        }
        const preview = document.getElementById('requestPreviewModal');
        if (preview && !preview.classList.contains('hidden')) {
          this.resolveRequestPreview(false);
          return;
        }
        this.closeRequestModal();
      });

      if (!this.token) {
        await this.ensurePublicRegistrationData().catch((err) => {
          console.warn('PUBLIC_REGISTRATION_DATA', err);
        });
        this.showLogin();
        if (this.socialRegistrationContext && this.oauthResult && this.oauthResult.action === 'REGISTRATION_REQUIRED') {
          this.showSocialRegistrationPanel();
        }
        this.showOAuthNotice();
        return;
      }

      // Phase 2: ตรวจ Session พร้อมโหลด Master + Dashboard ใน Apps Script execution เดียว
      this.showLoading(true);
      try {
        const res = await this.serverCall((runner) => runner.apiBootstrap(this.token));
        if (!res || !res.ok) {
          this.handleExpiredSession(res && res.message);
          return;
        }

        this.applyBootstrapData(res.data);
        this.showMain();
        const targetTab = (this.oauthResult && this.oauthResult.returnTab) || sessionStorage.getItem('FRS_POST_LOGIN_TAB') || '';
        sessionStorage.removeItem('FRS_POST_LOGIN_TAB');
        if (targetTab && ['dashboard', 'newRequest', 'myRequests', 'profile', 'registrations'].indexOf(targetTab) !== -1) {
          this.showTab(targetTab, true);
        }
        this.showOAuthNotice();
      } catch (err) {
        console.error('BOOTSTRAP_SESSION', err);
        this.handleExpiredSession();
      } finally {
        this.showLoading(false);
      }
    },


    initTheme() {
      let theme = 'light';
      try {
        const saved = localStorage.getItem(this.themeKey);
        if (saved === 'dark' || saved === 'light') theme = saved;
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
      } catch (err) {
        console.warn('THEME_READ', err);
      }
      this.applyTheme(theme, false);
    },

    applyTheme(theme, persist = true) {
      const normalized = theme === 'dark' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', normalized);
      document.body && document.body.setAttribute('data-theme', normalized);
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta) themeMeta.setAttribute('content', normalized === 'dark' ? '#081323' : '#f4f8fd');
      const lightButton = document.getElementById('themeLightButton');
      const darkButton = document.getElementById('themeDarkButton');
      if (lightButton) lightButton.classList.toggle('active', normalized === 'light');
      if (darkButton) darkButton.classList.toggle('active', normalized === 'dark');
      if (persist) {
        try { localStorage.setItem(this.themeKey, normalized); } catch (err) { console.warn('THEME_WRITE', err); }
      }
      return normalized;
    },

    setTheme(theme) {
      this.applyTheme(theme, true);
    },

    toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      this.setTheme(current === 'dark' ? 'light' : 'dark');
    },

    bindWorkspaceShortcuts() {
      if (document.documentElement.dataset.workspaceShortcutsBound === 'true') return;
      document.documentElement.dataset.workspaceShortcutsBound = 'true';
      document.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && String(event.key || '').toLowerCase() === 'k') {
          const input = document.getElementById('globalSearchInput');
          if (input && !document.getElementById('mainView').classList.contains('hidden')) {
            event.preventDefault();
            input.focus();
            input.select();
          }
        }
      });
    },

    toggleSidebar(forceOpen) {
      const sidebar = document.getElementById('appSidebar');
      const backdrop = document.getElementById('sidebarBackdrop');
      if (!sidebar) return;
      const shouldOpen = typeof forceOpen === 'boolean' ? forceOpen : !sidebar.classList.contains('is-open');
      sidebar.classList.toggle('is-open', shouldOpen);
      if (backdrop) backdrop.classList.toggle('is-open', shouldOpen);
      document.body.classList.toggle('sidebar-open', shouldOpen);
    },

    async quickSearch(event) {
      if (event) event.preventDefault();
      const globalInput = document.getElementById('globalSearchInput');
      const query = String(globalInput ? globalInput.value : '').trim();
      const requestSearch = document.getElementById('requestSearch');
      if (requestSearch) requestSearch.value = query;
      this.showTab('myRequests', false);
      if (!this.requestsLoaded) await this.loadRequests(true, true);
      else this.applyRequestFilters();
      this.toggleSidebar(false);
    },


    bindGlobalErrorFeedback() {
      if (document.documentElement.dataset.globalErrorBound === 'true') return;
      document.documentElement.dataset.globalErrorBound = 'true';

      const report = (source, error) => {
        console.error(source, error);
        const now = Date.now();
        if (this.lastClientErrorAt && now - this.lastClientErrorAt < 1500) return;
        this.lastClientErrorAt = now;
        this.notify('ระบบไม่สามารถดำเนินการได้ กรุณาลองอีกครั้งหรือโหลดหน้าใหม่', 'error', 'เกิดข้อผิดพลาดในหน้าเว็บ');
      };

      window.addEventListener('error', (event) => {
        if (!event || !event.error) return;
        report('CLIENT_RUNTIME_ERROR', event.error);
      });

      window.addEventListener('unhandledrejection', (event) => {
        report('CLIENT_UNHANDLED_REJECTION', event && event.reason);
        if (event && typeof event.preventDefault === 'function') event.preventDefault();
      });
    },


    bindThaiPhoneInputs() {
      if (document.documentElement.dataset.thaiPhoneBound === 'true') {
        this.refreshThaiPhoneInputs();
        return;
      }
      document.documentElement.dataset.thaiPhoneBound = 'true';

      document.addEventListener('input', (event) => {
        const input = event.target.closest('[data-thai-phone]');
        if (!input) return;
        input.value = this.formatThaiPhoneDisplay(input.value);
        this.clearThaiPhoneError(input.id);
      });

      document.addEventListener('blur', (event) => {
        const input = event.target.closest('[data-thai-phone]');
        if (!input || !input.value.trim()) return;
        this.validateThaiPhoneField(input.id, true);
      }, true);

      document.addEventListener('paste', (event) => {
        const input = event.target.closest('[data-thai-phone]');
        if (!input) return;
        setTimeout(() => {
          input.value = this.formatThaiPhoneDisplay(input.value);
          this.clearThaiPhoneError(input.id);
        }, 0);
      });

      this.refreshThaiPhoneInputs();
    },

    refreshThaiPhoneInputs() {
      document.querySelectorAll('[data-thai-phone]').forEach((input) => {
        if (input.value) input.value = this.formatThaiPhoneDisplay(input.value);
      });
    },

    normalizeThaiPhoneDigits(value) {
      let digits = String(value || '').replace(/\D/g, '');
      if (digits.indexOf('0066') === 0) digits = digits.slice(4);
      else if (digits.indexOf('66') === 0) digits = digits.slice(2);
      if (digits.indexOf('0') === 0) digits = digits.slice(1);
      return digits.slice(0, 9);
    },

    formatThaiPhoneDisplay(value) {
      const digits = this.normalizeThaiPhoneDigits(value);
      if (!digits) return '';
      if (digits.length <= 2) return digits;
      if (digits.length <= 5) return digits.slice(0, 2) + ' ' + digits.slice(2);
      return digits.slice(0, 2) + ' ' + digits.slice(2, 5) + ' ' + digits.slice(5, 9);
    },

    toThaiPhoneE164(value) {
      const digits = this.normalizeThaiPhoneDigits(value);
      return /^[2-9]\d{7,8}$/.test(digits) ? '+66' + digits : '';
    },

    clearThaiPhoneError(inputId) {
      const error = document.getElementById(inputId + 'Error');
      const input = document.getElementById(inputId);
      if (error) error.textContent = '';
      if (input) input.removeAttribute('aria-invalid');
    },

    validateThaiPhoneField(inputId, showError) {
      const input = document.getElementById(inputId);
      if (!input) return '';
      const raw = input.value.trim();
      if (!raw) {
        this.clearThaiPhoneError(inputId);
        return '';
      }
      const e164 = this.toThaiPhoneE164(raw);
      const error = document.getElementById(inputId + 'Error');
      if (!e164) {
        input.setAttribute('aria-invalid', 'true');
        if (showError && error) error.textContent = 'กรุณากรอกเบอร์โทรศัพท์ไทยให้ถูกต้อง';
        return null;
      }
      input.value = this.formatThaiPhoneDisplay(e164);
      this.clearThaiPhoneError(inputId);
      return e164;
    },

    bindPasswordVisibility() {
      if (document.documentElement.dataset.passwordToggleBound === 'true') return;
      document.documentElement.dataset.passwordToggleBound = 'true';
      document.addEventListener('click', (event) => {
        const button = event.target.closest('[data-password-target]');
        if (!button) return;
        const input = document.getElementById(button.getAttribute('data-password-target'));
        if (!input) return;
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        button.setAttribute('aria-pressed', show ? 'true' : 'false');
        button.setAttribute('aria-label', show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน');
        const eye = button.querySelector('.password-icon-eye');
        const eyeOff = button.querySelector('.password-icon-eye-off');
        if (eye) eye.classList.toggle('hidden', show);
        if (eyeOff) eyeOff.classList.toggle('hidden', !show);
        input.focus({ preventScroll: true });
      });
    },

    serverCall(invoker) {
      return new Promise((resolve, reject) => {
        const runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject);
        try {
          invoker(runner);
        } catch (err) {
          reject(err);
        }
      });
    },

    clientErrorMessage(error, fallback) {
      const raw = error && (error.message || error.toString && error.toString());
      const message = String(raw || '').trim();
      if (!message) return fallback || 'ระบบไม่สามารถดำเนินการได้';
      if (/network|fetch|connection|failed to fetch|service unavailable/i.test(message)) {
        return 'การเชื่อมต่อขัดข้อง กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่';
      }
      if (/timeout|timed out/i.test(message)) {
        return 'ระบบใช้เวลาประมวลผลนานกว่าปกติ กรุณาตรวจสอบรายการก่อนกดซ้ำ';
      }
      return message;
    },

    bindOAuthCallbackMessage() {
      if (document.documentElement.dataset.oauthCallbackBound === 'true') return;
      document.documentElement.dataset.oauthCallbackBound = 'true';

      window.addEventListener('message', (event) => {
        const packet = event && event.data;
        if (!packet || packet.type !== 'FRS_OAUTH_CALLBACK' || !packet.result) return;
        if (this.socialAuthWindow && event.source !== this.socialAuthWindow) return;

        this.persistOAuthResult(packet.result);
        try {
          if (event.source && !event.source.closed) event.source.close();
        } catch (closeError) {}
        window.location.reload();
      });
    },

    persistOAuthResult(result) {
      if (!result || typeof result !== 'object') return;
      if (result.token) sessionStorage.setItem(this.sessionKey, String(result.token));
      if (result.registrationToken) {
        sessionStorage.setItem('FRS_REGISTRATION_CONTEXT', JSON.stringify(result));
      }
      sessionStorage.setItem('FRS_OAUTH_RESULT', JSON.stringify(result));
    },

    consumeOAuthStorage() {
      const hash = String(window.location.hash || '');
      if (hash.indexOf('#frs_oauth=') === 0) {
        try {
          const resultFromHash = JSON.parse(decodeURIComponent(hash.slice('#frs_oauth='.length)));
          this.persistOAuthResult(resultFromHash);
          history.replaceState(null, document.title, window.location.pathname + window.location.search);
        } catch (hashError) {
          console.warn('OAUTH_HASH', hashError);
        }
      }

      this.token = sessionStorage.getItem(this.sessionKey) || '';
      try {
        this.oauthResult = JSON.parse(sessionStorage.getItem('FRS_OAUTH_RESULT') || 'null');
      } catch (err) {
        this.oauthResult = null;
      }
      sessionStorage.removeItem('FRS_OAUTH_RESULT');

      try {
        this.socialRegistrationContext = JSON.parse(sessionStorage.getItem('FRS_REGISTRATION_CONTEXT') || 'null');
      } catch (err) {
        this.socialRegistrationContext = null;
      }
    },

    async ensurePublicRegistrationData() {
      if (this.publicRegistrationData) return this.publicRegistrationData;
      if (this.publicRegistrationPromise) return this.publicRegistrationPromise;
      this.publicRegistrationPromise = this.loadPublicRegistrationData()
        .finally(() => { this.publicRegistrationPromise = null; });
      return this.publicRegistrationPromise;
    },

    async loadPublicRegistrationData() {
      const res = await this.serverCall((runner) => runner.apiGetPublicRegistrationData());
      if (!res || !res.ok) throw new Error((res && res.message) || 'โหลดการตั้งค่าสมัครสมาชิกไม่สำเร็จ');
      this.publicRegistrationData = res.data || {};
      this.renderPublicAuthConfig();
    },

    renderPublicAuthConfig() {
      const data = this.publicRegistrationData || {};
      const cfg = data.config || {};
      const googleEnabled = Boolean(cfg.googleEnabled);
      const lineEnabled = Boolean(cfg.lineEnabled);
      const registrationEnabled = Boolean(cfg.registrationEnabled);
      const socialEnabled = googleEnabled || lineEnabled;

      ['googleLoginButton', 'googleRegisterButton', 'linkGoogleButton'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('hidden', !googleEnabled);
      });
      ['lineLoginButton', 'lineRegisterButton', 'linkLineButton'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('hidden', !lineEnabled);
      });

      const socialLogin = document.getElementById('socialLoginButtons');
      const socialRegister = document.getElementById('registerSocialButtons');
      if (socialLogin) socialLogin.classList.toggle('hidden', !socialEnabled);
      if (socialRegister) socialRegister.classList.toggle('hidden', !socialEnabled);
      const linkWrap = document.getElementById('registrationLinkWrap');
      if (linkWrap) linkWrap.classList.toggle('hidden', !registrationEnabled);

      this.fillDepartmentSelect('registerDepartment');
      this.fillDepartmentSelect('socialRegisterDepartment');
    },

    fillDepartmentSelect(elementId) {
      const select = document.getElementById(elementId);
      if (!select) return;
      const rows = (this.publicRegistrationData && this.publicRegistrationData.departments) || [];
      const current = select.value;
      const options = ['<option value="">เลือกฝ่าย/แผนก</option>'];
      rows.forEach((row) => {
        options.push('<option value="' + this.escapeAttr(row.DEPARTMENT_ID) + '">' +
          this.escapeHtml((row.DIVISION || '') + ' / ' + (row.DEPARTMENT || '')) + '</option>');
      });
      select.innerHTML = options.join('');
      if (current) select.value = current;
    },

    getSelectedDepartment(elementId) {
      const select = document.getElementById(elementId);
      const id = select ? select.value : '';
      const rows = (this.publicRegistrationData && this.publicRegistrationData.departments) || [];
      return rows.find((row) => String(row.DEPARTMENT_ID) === String(id)) || null;
    },

    showAuthPanel(name) {
      const map = {
        login: 'loginPanel',
        manualRegister: 'manualRegisterPanel',
        registerSocial: 'socialRegisterPanel'
      };
      Object.keys(map).forEach((key) => {
        const el = document.getElementById(map[key]);
        if (el) el.classList.toggle('hidden', key !== name);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    async beginSocialAuth(provider, intent = 'LOGIN') {
      const normalizedIntent = String(intent || 'LOGIN').toUpperCase();
      const cfg = (this.publicRegistrationData && this.publicRegistrationData.config) || {};
      if (provider === 'GOOGLE' && !cfg.googleEnabled) {
        this.notify('Google Login ยังไม่ได้ตั้งค่าในระบบ', 'warning');
        return;
      }
      if (provider === 'LINE' && !cfg.lineEnabled) {
        this.notify('LINE Login ยังไม่ได้ตั้งค่าในระบบ', 'warning');
        return;
      }

      // Open a temporary window directly from the user's click. Apps Script runs
      // inside a sandboxed iframe, so assigning window.top.location after an
      // asynchronous server call can raise SecurityError: The operation is insecure.
      let authWindow = null;
      try {
        authWindow = window.open('about:blank', '_blank');
        if (authWindow) {
          authWindow.document.open();
          authWindow.document.write(
            '<!doctype html><html><head><meta charset="utf-8">' +
            '<meta name="viewport" content="width=device-width,initial-scale=1">' +
            '<title>FRS Social Login</title></head>' +
            '<body style="margin:0;min-height:100vh;display:grid;place-items:center;' +
            'font-family:system-ui,-apple-system,sans-serif;background:#f4f9ff;color:#1e3a5f">' +
            '<div style="text-align:center;padding:24px">' +
            '<div style="width:42px;height:42px;margin:0 auto 16px;border:4px solid #dbeafe;' +
            'border-top-color:#1683ff;border-radius:50%;animation:spin .8s linear infinite"></div>' +
            '<strong>กำลังเปิดหน้าตรวจสอบตัวตน...</strong>' +
            '<style>@keyframes spin{to{transform:rotate(360deg)}}</style>' +
            '</div></body></html>'
          );
          authWindow.document.close();
        }
      } catch (popupErr) {
        authWindow = null;
      }

      this.showLoading(true);
      try {
        const res = await this.serverCall((runner) => runner.apiBeginSocialAuth(
          provider,
          normalizedIntent,
          normalizedIntent === 'LINK' ? this.token : '',
          normalizedIntent === 'LINK' ? 'profile' : 'dashboard'
        ));
        if (!res || !res.ok) {
          if (authWindow && !authWindow.closed) authWindow.close();
          this.handleApiError(res);
          return;
        }

        if (normalizedIntent === 'LINK') {
          sessionStorage.setItem('FRS_POST_LOGIN_TAB', 'profile');
        }

        const authUrl = String((res.data && res.data.url) || '').trim();
        if (!/^https:\/\//i.test(authUrl)) {
          if (authWindow && !authWindow.closed) authWindow.close();
          throw new Error('OAuth URL ไม่ถูกต้อง');
        }

        if (authWindow && !authWindow.closed) {
          this.socialAuthWindow = authWindow;
          authWindow.location.replace(authUrl);
          try { authWindow.focus(); } catch (focusErr) {}
          return;
        }

        // Popup blocked: present a real user-activated link instead of trying to
        // navigate the sandboxed top frame programmatically.
        const proceed = await this.confirmBox({
          type: 'warning',
          title: 'เปิดหน้าตรวจสอบตัวตน',
          message: 'เบราว์เซอร์ปิดกั้นหน้าต่างเข้าสู่ระบบ กรุณากดดำเนินการต่อเพื่อเปิด ' + provider,
          confirmText: 'ดำเนินการต่อ',
          cancelText: 'ยกเลิก'
        });
        if (proceed) {
          const anchor = document.createElement('a');
          anchor.href = authUrl;
          anchor.target = '_blank';
          anchor.rel = 'noopener noreferrer';
          anchor.style.display = 'none';
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
        }
      } catch (err) {
        if (authWindow && !authWindow.closed) authWindow.close();
        this.notify((err && err.message) || 'เปิดหน้าตรวจสอบตัวตนไม่สำเร็จ', 'error');
      } finally {
        this.showLoading(false);
      }
    },

    showOAuthNotice() {
      const result = this.oauthResult;
      if (!result) return;
      this.oauthResult = null;
      if (result.action === 'REGISTRATION_REQUIRED') return;
      const type = result.action === 'ERROR' ? 'error' :
        (result.action === 'REGISTRATION_PENDING' ? 'info' : 'success');
      this.notify(result.message || 'ดำเนินการเรียบร้อย', type,
        result.action === 'ERROR' ? 'Social Login ไม่สำเร็จ' : 'ข้อความจากระบบ');
    },

    showSocialRegistrationPanel() {
      const context = this.socialRegistrationContext;
      if (!context || !context.registrationToken || !context.profile) {
        this.notify('ข้อมูลสมัครสมาชิกหมดอายุหรือไม่ครบ กรุณาเริ่มใหม่', 'warning');
        this.cancelSocialRegistration();
        return;
      }
      const profile = context.profile;
      document.getElementById('socialProviderText').textContent = 'ยืนยันตัวตนด้วย ' + (profile.provider || 'Social Account') + ' แล้ว';
      const socialEmailInput = document.getElementById('socialRegisterEmail');
      socialEmailInput.value = profile.email || '';
      socialEmailInput.readOnly = Boolean(profile.email && profile.emailVerified);
      socialEmailInput.title = socialEmailInput.readOnly ? 'อีเมลนี้ได้รับการยืนยันจาก Provider และไม่สามารถแก้ไขได้' : '';
      document.getElementById('socialRegisterUsername').value = profile.usernameSuggestion || '';
      document.getElementById('socialRegisterFullName').value = profile.displayName || '';
      const socialPhoneInput = document.getElementById('socialRegisterPhone');
      if (socialPhoneInput) socialPhoneInput.value = '';
      this.clearThaiPhoneError('socialRegisterPhone');
      const card = document.getElementById('socialProfileCard');
      const avatar = profile.profileImageUrl
        ? '<img class="social-avatar" src="' + this.escapeAttr(profile.profileImageUrl) + '" alt="รูปโปรไฟล์">'
        : '<div class="social-avatar social-avatar-placeholder">' + this.escapeHtml((profile.provider || 'U').charAt(0)) + '</div>';
      card.innerHTML = avatar + '<div><strong>' + this.escapeHtml(profile.displayName || 'บัญชีที่ยืนยันแล้ว') +
        '</strong><div class="field-help">' + this.escapeHtml(profile.email || 'Provider ไม่ได้ส่งอีเมล กรุณากรอกอีเมลที่ใช้งานจริง') + '</div></div>';
      this.showAuthPanel('registerSocial');
    },

    cancelSocialRegistration() {
      sessionStorage.removeItem('FRS_REGISTRATION_CONTEXT');
      this.socialRegistrationContext = null;
      this.showAuthPanel('login');
    },

    showPrivacyNotice() {
      return this.notify(

        'info',
        'การใช้ข้อมูลส่วนบุคคล'
      );
    },

    async submitManualRegistration(event) {
      if (event) event.preventDefault();

      let phoneValue;
      try {
        phoneValue = this.validateThaiPhoneField('registerPhone', true);
        if (phoneValue === null) {
          const phoneInput = document.getElementById('registerPhone');
          if (phoneInput) phoneInput.focus();

          return;
        }
      } catch (err) {
        console.error('SUBMIT_MANUAL_REGISTRATION_PREFLIGHT', err);
        await this.notify((err && err.message) || 'ไม่สามารถตรวจสอบข้อมูลสมัครสมาชิกได้', 'error');
        return;
      }

      const department = this.getSelectedDepartment('registerDepartment');
      const payload = {
        email: document.getElementById('registerEmail').value.trim(),
        username: document.getElementById('registerUsername').value.trim(),
        password: document.getElementById('registerPassword').value,
        fullName: document.getElementById('registerFullName').value.trim(),
        phone: phoneValue,
        division: department ? department.DIVISION : '',
        department: department ? department.DEPARTMENT : '',
        position: document.getElementById('registerPosition').value.trim(),
        website: document.getElementById('registerWebsite').value,

      };
      if (!department || !document.getElementById('registerConsent').checked) {

        return;
      }
      const confirmed = await this.confirmBox({
        title: 'ส่งคำขอสมัครสมาชิก?',
        message: 'บัญชีจะยังไม่สามารถใช้งานได้จนกว่าผู้ดูแลระบบจะอนุมัติ',
        detail: payload.fullName + '\n' + payload.email,
        confirmText: 'ส่งคำขอ',
        cancelText: 'ตรวจสอบอีกครั้ง'
      });
      if (!confirmed) return;

      this.showLoading(true);
      try {
        const res = await this.serverCall((runner) => runner.apiRegisterPassword(payload));
        if (!res || !res.ok) {
          this.notify((res && res.message) || 'สมัครสมาชิกไม่สำเร็จ', 'error');
          return;
        }
        document.getElementById('manualRegisterForm').reset();
        this.clearThaiPhoneError('registerPhone');
        this.showAuthPanel('login');
        await this.notify(res.message, 'success', 'ส่งคำขอแล้ว');
      } catch (err) {
        this.notify((err && err.message) || 'สมัครสมาชิกไม่สำเร็จ', 'error');
      } finally {
        this.showLoading(false);
      }
    },

    async login(event) {
      if (event) event.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!username || !password) {
        this.notify('กรุณากรอก Username และ Password', 'warning', 'ข้อมูลเข้าสู่ระบบยังไม่ครบ');
        return;
      }

      this.showLoading(true);
      try {
        const res = await this.serverCall((runner) => runner.apiLogin({
          username: username,
          password: password,
          userAgent: navigator.userAgent || ''
        }));

        if (!res || !res.ok) {
          this.notify((res && res.message) || 'เข้าสู่ระบบไม่สำเร็จ', 'error', 'เข้าสู่ระบบไม่สำเร็จ');
          return;
        }

        this.token = res.data.token;
        this.currentUser = res.data.user;
        sessionStorage.setItem(this.sessionKey, this.token);
        document.getElementById('loginPassword').value = '';
        this.showMain();
        await this.loadInitialData();
      } catch (err) {
        this.notify((err && err.message) || 'เกิดข้อผิดพลาด', 'error', 'เกิดข้อผิดพลาด');
      } finally {
        this.showLoading(false);
      }
    },

    async logout() {
      const confirmed = await this.confirmBox({
        title: 'ออกจากระบบ?',
        message: 'Session ปัจจุบันจะถูกยกเลิก และต้องเข้าสู่ระบบใหม่เมื่อต้องการใช้งานต่อ',
        confirmText: 'ออกจากระบบ',
        cancelText: 'อยู่ต่อ',
        type: 'question'
      });
      if (!confirmed) return;

      const token = this.token;
      this.clearSession();
      this.closeRequestModal();
      this.showLogin();
      if (token) google.script.run.apiLogout(token);
    },

    clearSession() {
      this.token = '';
      this.currentUser = null;
      this.currentDetail = null;
      this.permissions = null;
      this.requestRows = [];
      this.requestsLoaded = false;
      this.requestLoadPromise = null;
      this.actionLocks = Object.create(null);
      this.pendingRequestClientId = '';
      sessionStorage.removeItem(this.sessionKey);
    },

    handleExpiredSession(message) {
      this.clearSession();
      this.closeRequestModal();
      this.showLogin();
      if (message) this.notify(message, 'warning', 'Session หมดอายุ');
    },

    handleApiError(res) {
      const message = (res && res.message) || 'เกิดข้อผิดพลาด';
      if (/Session|เข้าสู่ระบบใหม่/i.test(message)) {
        this.handleExpiredSession(message);
      } else {
        this.notify(message, 'error', 'ไม่สามารถดำเนินการได้');
      }
    },

    showLogin() {
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('mainView').classList.add('hidden');
      if (!this.socialRegistrationContext) this.showAuthPanel('login');
      if (!this.publicRegistrationData) {
        this.ensurePublicRegistrationData().catch((err) => console.warn('PUBLIC_REGISTRATION_DATA', err));
      }
    },

    showMain() {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('mainView').classList.remove('hidden');

      const requestPhone = document.getElementById('PHONE');
      if (requestPhone) requestPhone.value = '';
      this.clearThaiPhoneError('PHONE');

      const role = (this.currentUser && this.currentUser.ROLE) || '';
      const fullName = (this.currentUser && this.currentUser.FULL_NAME) || 'ผู้ใช้งาน';
      const firstName = String(fullName).trim().split(/\s+/)[0] || 'ผู้ใช้งาน';
      const currentUserText = document.getElementById('currentUserText');
      if (currentUserText) currentUserText.textContent = fullName + ' | ' + role;
      const headerUserName = document.getElementById('headerUserName');
      const headerUserRole = document.getElementById('headerUserRole');
      const headerAvatar = document.getElementById('headerAvatar');
      const sidebarUserName = document.getElementById('sidebarUserName');
      const sidebarUserRole = document.getElementById('sidebarUserRole');
      const sidebarAvatar = document.getElementById('sidebarAvatar');
      const greeting = document.getElementById('dashboardGreeting');
      if (headerUserName) headerUserName.textContent = firstName;
      if (headerUserRole) headerUserRole.textContent = role;
      if (headerAvatar) headerAvatar.textContent = firstName.charAt(0).toUpperCase();
      if (sidebarUserName) sidebarUserName.textContent = firstName;
      if (sidebarUserRole) sidebarUserRole.textContent = role;
      if (sidebarAvatar) sidebarAvatar.textContent = firstName.charAt(0).toUpperCase();
      if (greeting) greeting.textContent = 'สวัสดีครับ, ' + firstName;
      const requestListTitle = document.getElementById('requestListTitle');
      if (requestListTitle) {
        requestListTitle.textContent = role === 'USER'
          ? 'รายการแจ้งซ่อมของฉัน'
          : (role === 'TECHNICIAN' ? 'คิวงานและงานที่รับผิดชอบ' : 'รายการแจ้งซ่อมทั้งหมด');
      }
      const navMyRequestsLabel = document.getElementById('navMyRequestsLabel');
      const mobileNavMyRequestsLabel = document.getElementById('mobileNavMyRequestsLabel');
      const queueLabel = role === 'USER' ? 'งานของฉัน' : 'คิวงาน';
      if (navMyRequestsLabel) navMyRequestsLabel.textContent = queueLabel;
      if (mobileNavMyRequestsLabel) mobileNavMyRequestsLabel.textContent = queueLabel;

      const canApprove = ['ADMIN', 'MANAGER'].indexOf(String(role).toUpperCase()) !== -1;
      const registrationNav = document.getElementById('navRegistrations');
      if (registrationNav) {
        registrationNav.classList.toggle('nav-unavailable', !canApprove);
        registrationNav.setAttribute('aria-hidden', canApprove ? 'false' : 'true');
        registrationNav.tabIndex = canApprove ? 0 : -1;
      }
      const dataNav = document.getElementById('navData');
      if (dataNav) dataNav.classList.toggle('nav-unavailable', !canApprove);
      const dataRegistrationButton = document.getElementById('dataRegistrationButton');
      if (dataRegistrationButton) dataRegistrationButton.classList.toggle('hidden', !canApprove);
      this.applyTheme(document.documentElement.getAttribute('data-theme') || 'light', false);
      this.showTab('dashboard', false);
    },

    applyBootstrapData(data) {
      const payload = data || {};
      this.currentUser = payload.user || this.currentUser;
      this.permissions = payload.permissions || {};
      this.master = payload.master || { systems: [], locations: [], departments: [], sla: [], status: [] };
      this.requestRows = [];
      this.requestsLoaded = false;
      this.requestLoadPromise = null;
      this.lastLoaded.myRequests = 0;
      this.renderMasterOptions();
      this.renderDashboardData(payload.dashboard || {});
    },

    async loadInitialData() {
      this.renderDashboardSkeleton();
      const res = await this.serverCall((runner) => runner.apiBootstrap(this.token));
      if (!res || !res.ok) {
        this.handleApiError(res);
        return false;
      }
      this.applyBootstrapData(res.data);
      return true;
    },

    renderDashboardData(data) {
      const dashboard = data || {};
      const summary = dashboard.summary || {};
      const setText = (id, value) => {
        const element = document.getElementById(id);
        if (element) element.textContent = value;
      };
      this.currentDashboard = dashboard;
      const active = Number(summary.assigned || 0) + Number(summary.inProgress || 0) + Number(summary.waitingPart || 0) + Number(summary.outsource || 0);
      const done = Number(summary.done || 0) + Number(summary.closed || 0);
      const waiting = Number(summary.new || 0) + Number(summary.received || 0);
      setText('statTotal', summary.total || 0);
      setText('statProgress', active);
      setText('statDone', done);
      setText('statSla', summary.slaCompliance === null || summary.slaCompliance === undefined ? '—' : (summary.slaCompliance + '%'));
      setText('overviewDone', done);
      setText('overviewActive', active);
      setText('overviewWaiting', waiting);
      setText('overviewOverSla', summary.overSla || 0);
      const notificationCount = Number(
        summary.alertCount !== undefined && summary.alertCount !== null
          ? summary.alertCount
          : (Number(summary.critical || 0) + Number(summary.overSla || 0))
      );
      const notificationBadge = document.getElementById('notificationBadge');
      if (notificationBadge) {
        notificationBadge.textContent = notificationCount > 99 ? '99+' : String(notificationCount);
        notificationBadge.classList.toggle('hidden', notificationCount < 1);
      }
      const latest = Array.isArray(dashboard.latest) ? dashboard.latest : [];
      const activities = Array.isArray(dashboard.activities) ? dashboard.activities : [];
      this.renderDashboardTable(latest);
      this.renderDashboardActivities(activities);
      this.renderDashboardExperience(summary, latest);
      this.lastLoaded.dashboard = Date.now();
      const dashboardTab = document.getElementById('dashboardTab');
      if (dashboardTab) dashboardTab.classList.remove('panel-loading');
    },

    async loadDashboard(showLoader = true) {
      if (showLoader) this.renderDashboardSkeleton();
      try {
        const res = await this.serverCall((runner) => runner.apiGetDashboard(this.token));
        if (!res || !res.ok) {
          this.handleApiError(res);
          return;
        }
        this.renderDashboardData(res.data);
      } catch (err) {
        this.notify(this.clientErrorMessage(err, 'โหลด Dashboard ไม่สำเร็จ'), 'error', 'โหลดข้อมูลไม่สำเร็จ');
      } finally {
        const dashboardTab = document.getElementById('dashboardTab');
        if (dashboardTab) dashboardTab.classList.remove('panel-loading');
      }
    },

    renderDashboardExperience(summary, latest) {
      const rows = Array.isArray(latest) ? latest : [];
      const focus = rows.find((row) => !['CLOSED', 'CANCELLED'].includes(String(row.STATUS_CODE || '').toUpperCase())) || rows[0] || null;
      const progress = focus ? Number(focus.PROGRESS_PERCENT || (focus.PROGRESS && focus.PROGRESS.percent) || 0) : 0;
      const step = focus ? Number(focus.PROGRESS_STEP || (focus.PROGRESS && focus.PROGRESS.step) || this.progressStepFromStatus(focus.STATUS_CODE)) : 0;
      const status = focus ? String(focus.STATUS_NAME_TH || focus.STATUS_CODE || '-') : 'พร้อมใช้งาน';
      const setText = (id, value) => { const el = document.getElementById(id); if (el) el.textContent = value; };
      this.focusRequestId = focus ? String(focus.REQUEST_ID || '') : '';
      setText('focusRequestId', focus ? (focus.REQUEST_ID || '-') : 'ยังไม่มีรายการ');
      setText('focusRequestSubject', focus ? (focus.PROBLEM_DETAIL || 'ไม่มีรายละเอียดปัญหา') : 'ระบบจะเลือกงานล่าสุดที่ยังไม่ปิด');
      setText('focusStatusBadge', status);
      setText('focusProgressText', progress + '%');
      setText('focusLocation', focus ? (focus.LOCATION_FULL || '-') : '-');
      setText('focusSystem', focus ? (focus.SYSTEM_NAME_TH || '-') : '-');
      setText('focusTechnician', focus ? (focus.ASSIGNED_TO_NAME || focus.ASSIGNED_TO || 'ยังไม่มอบหมาย') : '-');
      const workflowDates = focus && focus.WORKFLOW_DATES ? focus.WORKFLOW_DATES : {};
      const focusStatusCode = focus ? String(focus.STATUS_CODE || '').toUpperCase() : '';
      setText('focusStepDate1', focus ? this.formatDashboardDate(workflowDates.NEW || focus.REQUEST_DATE || focus.CREATED_AT) : '—');
      setText('focusStepDate2', focus ? this.formatDashboardDate(workflowDates.RECEIVED || focus.RECEIVED_DATE) : '—');
      setText('focusStepDate3', focus && step >= 3 ? this.formatDashboardDate(workflowDates.ASSIGNED || focus.ASSIGNED_DATE || focus.UPDATED_AT) : '—');
      setText('focusStepDate4', focus && step >= 4 ? this.formatDashboardDate(workflowDates.IN_PROGRESS || focus.FIX_START_DATE) : '—');
      setText('focusStepDate5', focusStatusCode === 'CLOSED' ? this.formatDashboardDate(workflowDates.CLOSED || focus.CLOSED_DATE || focus.UPDATED_AT) : '—');
      const detailButton = document.getElementById('focusDetailButton');
      if (detailButton) detailButton.disabled = !this.focusRequestId;
      const fill = document.getElementById('focusProgressFill');
      if (fill) fill.style.width = Math.max(0, Math.min(100, progress)) + '%';
      const badge = document.getElementById('focusStatusBadge');
      if (badge) badge.dataset.status = focus ? String(focus.STATUS_CODE || '').toUpperCase() : '';
      document.querySelectorAll('#dashboardStepper .frs-step').forEach((node) => {
        const n = Number(node.dataset.step || 0);
        node.classList.toggle('is-done', step > 0 && n < step);
        node.classList.toggle('is-active', step > 0 && n === step);
      });

      const active = Number(summary.assigned || 0) + Number(summary.inProgress || 0) + Number(summary.waitingPart || 0) + Number(summary.outsource || 0);
      const closed = Number(summary.done || 0) + Number(summary.closed || 0);
      const denominator = Math.max(0, Number(summary.total || 0) - Number(summary.cancelled || 0));
      const completion = denominator > 0 ? Math.round((closed / denominator) * 100) : 0;
      setText('dashboardProgressPercent', completion + '%');
      const ring = document.getElementById('dashboardProgressRing');
      if (ring) ring.style.setProperty('--progress', Math.max(0, Math.min(100, completion)));
      setText('dashboardHealthText', active > 0 ? 'มีงานกำลังดำเนินการ' : (closed > 0 ? 'งานล่าสุดเสร็จเรียบร้อย' : 'พร้อมรับรายการใหม่'));
      setText('dashboardHealthDetail', (summary.total || 0) + ' งานทั้งหมด · ' + active + ' งานกำลังดำเนินการ');
    },

    formatDashboardDate(value) {
      if (!value) return '—';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '—';
      try {
        return new Intl.DateTimeFormat('th-TH', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }).format(date);
      } catch (err) {
        return this.formatDateText(value) || '—';
      }
    },

    openFocusRequest() {
      if (!this.focusRequestId) return;
      this.openRequest(this.focusRequestId);
    },

    renderDashboardTable(rows) {
      const container = document.getElementById('latestList');
      if (!container) return;
      const data = Array.isArray(rows) ? rows.slice(0, 5) : [];
      if (!data.length) {
        container.innerHTML = '<div class="empty-state">ยังไม่มีรายการแจ้งซ่อม</div>';
        return;
      }
      const body = data.map((row) => {
        const statusCode = String(row.STATUS_CODE || '');
        return '<button class="frs-table-row" type="button" data-request-id="' + this.escapeAttr(row.REQUEST_ID || '') + '">' +
          '<span class="frs-table-id">' + this.escapeHtml(row.REQUEST_ID || '-') + '</span>' +
          '<span class="frs-table-subject"><strong>' + this.escapeHtml(row.PROBLEM_DETAIL || '-') + '</strong><small>' + this.escapeHtml(row.LOCATION_FULL || row.SYSTEM_NAME_TH || '-') + '</small></span>' +
          '<span><i class="badge ' + this.escapeAttr(statusCode) + '">' + this.escapeHtml(row.STATUS_NAME_TH || statusCode || '-') + '</i></span>' +
          '<span class="frs-table-assignee">' + this.escapeHtml(row.ASSIGNED_TO_NAME || 'ยังไม่มอบหมาย') + '</span>' +
          '<span class="frs-table-date">' + this.escapeHtml(this.formatDashboardDate(row.UPDATED_AT || row.CREATED_AT)) + '</span>' +
        '</button>';
      }).join('');
      container.innerHTML = '<div class="frs-table-header"><span>เลขที่งาน</span><span>เรื่อง</span><span>สถานะ</span><span>ผู้รับผิดชอบ</span><span>อัปเดตล่าสุด</span></div>' + body;
      container.querySelectorAll('[data-request-id]').forEach((row) => row.addEventListener('click', () => this.openRequest(row.dataset.requestId)));
    },

    renderDashboardActivities(rows) {
      const container = document.getElementById('dashboardActivityList');
      if (!container) return;
      const data = Array.isArray(rows) ? rows : [];
      if (!data.length) {
        container.innerHTML = '<div class="empty-state">ยังไม่มีกิจกรรมล่าสุด</div>';
        return;
      }
      container.innerHTML = data.map((row) => {
        const status = String(row.NEW_STATUS_CODE || '').toUpperCase();
        return '<button class="frs-activity-item" type="button" data-request-id="' + this.escapeAttr(row.REQUEST_ID || '') + '">' +
          '<span class="frs-activity-icon ' + this.escapeAttr(status.toLowerCase()) + '">' + this.iconSvg(this.statusIconName(status)) + '</span>' +
          '<span class="frs-activity-copy"><strong>' + this.escapeHtml(row.REQUEST_ID || '-') + '</strong><small>' + this.escapeHtml((row.ACTION_NAME ? row.ACTION_NAME + ' · ' : '') + (row.NOTE || this.getStatusName(status))) + '</small></span>' +
          '<time>' + this.escapeHtml(this.formatRelativeTime(row.ACTION_DATE)) + '</time>' +
        '</button>';
      }).join('');
      container.querySelectorAll('[data-request-id]').forEach((row) => row.addEventListener('click', () => this.openRequest(row.dataset.requestId)));
    },

    formatRelativeTime(value) {
      if (!value) return '';
      const timestamp = new Date(value).getTime();
      if (!timestamp) return this.formatDashboardDate(value);
      const seconds = Math.max(0, Math.floor((Date.now() - timestamp) / 1000));
      if (seconds < 60) return 'เมื่อสักครู่';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return minutes + ' นาทีที่แล้ว';
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + ' ชั่วโมงที่แล้ว';
      const days = Math.floor(hours / 24);
      if (days < 7) return days + ' วันที่แล้ว';

      const summary = (this.currentDashboard && this.currentDashboard.summary) || {};

      }
      this.notify('งาน Critical ' + critical + ' รายการ · เกิน SLA ' + overSla + ' รายการ', overSla ? 'warning' : 'info', 'รายการที่ควรติดตาม');

    progressStepFromStatus(statusCode) {

      return map[String(statusCode || '').toUpperCase()] || 1;

    async refreshExperience() {
      this.invalidateTabs('dashboard', 'myRequests');
      if (this.requestsLoaded) {
        await Promise.all([this.loadDashboard(true), this.loadRequests(true, true)]);
      } else {
        await this.loadDashboard(true);
      }

    openQueueByStatus(statusCode) {
      const select = document.getElementById('requestStatusFilter');
      if (select) select.value = statusCode || '';
      this.showTab('myRequests', true);
    },

    async loadRequests(showLoader = true, force = false) {
      if (this.requestLoadPromise) {
        const pendingRows = await this.requestLoadPromise;
        if (!force) return pendingRows;
      }
      if (!force && this.requestsLoaded && !this.shouldRefreshTab('myRequests')) {
        this.applyRequestFilters();
        return this.requestRows;
      }

      if (showLoader) this.renderRequestListSkeleton('myRequestList', 5);
      const panel = document.getElementById('myRequestsTab');
      if (panel) panel.classList.add('panel-loading');

      this.requestLoadPromise = (async () => {
        try {
          const role = (this.currentUser && this.currentUser.ROLE) || '';
          const res = role === 'USER'
            ? await this.serverCall((runner) => runner.apiGetMyRequests(this.token))
            : await this.serverCall((runner) => runner.apiGetAllRequests(this.token));

          if (!res || !res.ok) {
            this.handleApiError(res);
            return [];
          }

          this.requestRows = Array.isArray(res.data) ? res.data : [];
          this.requestsLoaded = true;
          this.applyRequestFilters();
          this.lastLoaded.myRequests = Date.now();
          return this.requestRows;
        } catch (err) {
          this.notify(this.clientErrorMessage(err, 'โหลดรายการไม่สำเร็จ'), 'error', 'โหลดข้อมูลไม่สำเร็จ');
          const container = document.getElementById('myRequestList');
          if (container) container.innerHTML = '<div class="empty-state">โหลดรายการไม่สำเร็จ กรุณากดรีเฟรชอีกครั้ง</div>';
          return [];
        } finally {
          if (panel) panel.classList.remove('panel-loading');
          this.requestLoadPromise = null;
        }
      })();

      return this.requestLoadPromise;
    },

    async loadReports() {
      if (!this.requestsLoaded) await this.loadRequests(false, true);
      this.renderReports();
    },

    iconSvg(name, className) {
      const safeName = String(name || 'info').replace(/[^a-z0-9-]/gi, '');
      const cls = className ? 'frs-ui-icon ' + String(className).replace(/[^a-z0-9 _-]/gi, '') : 'frs-ui-icon';
      return '<svg class="' + cls + '" aria-hidden="true"><use href="#frs-icon-' + safeName + '"></use></svg>';
    },

    statusIconName(statusCode) {
      const code = String(statusCode || '').toUpperCase();

    exportRequestsCsv() {
      const rows = Array.isArray(this.requestRows) ? this.requestRows : [];
      if (!rows.length) {
        this.notify('ยังไม่มีข้อมูลสำหรับ Export กรุณาเปิดหน้ารายการงานก่อน', 'warning', 'ไม่พบข้อมูล');
        return;
      }
      const columns = [
        ['REQUEST_ID', 'เลขที่งาน'], ['REQUEST_DATE', 'วันที่แจ้ง'], ['PROBLEM_DETAIL', 'รายละเอียดปัญหา'],
        ['SYSTEM_NAME_TH', 'ระบบ'], ['LOCATION_FULL', 'สถานที่'], ['PRIORITY_NAME_TH', 'ความเร่งด่วน'],
        ['STATUS_NAME_TH', 'สถานะ'], ['REQUESTER_NAME', 'ผู้แจ้ง'], ['ASSIGNED_TO_NAME', 'ผู้รับผิดชอบ'],
        ['SLA_RESULT', 'ผล SLA'], ['COST', 'ค่าใช้จ่าย'], ['UPDATED_AT', 'อัปเดตล่าสุด']
      ];
      const csvCell = (value) => '"' + String(value === null || value === undefined ? '' : value).replace(/"/g, '""') + '"';
      const lines = [columns.map((col) => csvCell(col[1])).join(',')];

    renderMasterOptions() {
      const systems = (this.master && this.master.systems) || [];

      const sla = (this.master && this.master.sla) || [];
      const statuses = (this.master && this.master.status) || [];

      this.fillSelect('SYSTEM_CODE', systems, 'SYSTEM_CODE', 'SYSTEM_NAME_TH', 'เลือกระบบ/อุปกรณ์');

      this.fillSelect('PRIORITY_CODE', sla, 'PRIORITY_CODE', 'PRIORITY_NAME_TH', 'เลือกระดับความเร่งด่วน');
      this.fillSelect('requestStatusFilter', statuses, 'STATUS_CODE', 'STATUS_NAME_TH', 'ทุกสถานะ');

    fillSelect(elementId, rows, valueField, labelField, placeholder) {
      const select = document.getElementById(elementId);
      if (!select) return;
      const currentValue = select.value;
      const options = ['<option value="">' + this.escapeHtml(placeholder) + '</option>'];
      rows.forEach((row) => {
        options.push('<option value="' + this.escapeAttr(row[valueField]) + '">' + this.escapeHtml(row[labelField]) + '</option>');
      });
      select.innerHTML = options.join('');
      if (currentValue) select.value = currentValue;
    },

    bindSystemPriority() {
      document.addEventListener('change', (event) => {
        if (event.target && event.target.id === 'SYSTEM_CODE' && this.master) {
          const selected = (this.master.systems || []).find((row) => String(row.SYSTEM_CODE) === String(event.target.value));
          if (selected && selected.DEFAULT_PRIORITY_CODE) {
            document.getElementById('PRIORITY_CODE').value = selected.DEFAULT_PRIORITY_CODE;
          }
        }
      });
    },

    bindSearchableSelectFilters() {
      if (document.documentElement.dataset.selectFilterBound === 'true') return;
      document.documentElement.dataset.selectFilterBound = 'true';

      document.addEventListener('input', (event) => {
        const input = event.target.closest('[data-select-filter]');
        if (!input) return;
        const targetId = input.getAttribute('data-select-filter');
        clearTimeout(this.selectFilterTimers[targetId]);
        this.selectFilterTimers[targetId] = setTimeout(() => this.applySelectFilter(input), 180);
      });

      document.addEventListener('keydown', (event) => {
        const input = event.target.closest('[data-select-filter]');
        if (!input) return;
        if (event.key === 'Escape') {
          input.value = '';
          this.applySelectFilter(input);
          input.blur();
          return;
        }
        if (event.key === 'Enter') {
          const select = document.getElementById(input.getAttribute('data-select-filter'));
          if (!select) return;
          const visible = Array.from(select.options).filter((option) => option.value && !option.hidden);
          if (visible.length === 1) {
            event.preventDefault();
            select.value = visible[0].value;
            select.dispatchEvent(new Event('change', { bubbles: true }));
            select.focus();
          }
        }
      });
    },

    applySelectFilter(input) {
      if (!input) return;
      const select = document.getElementById(input.getAttribute('data-select-filter'));
      if (!select) return;
      const query = String(input.value || '').trim().toLocaleLowerCase('th-TH');
      let visibleCount = 0;
      Array.from(select.options).forEach((option, index) => {
        if (index === 0 || !option.value) {
          option.hidden = false;
          return;
        }
        const text = (String(option.textContent || '') + ' ' + String(option.value || '')).toLocaleLowerCase('th-TH');
        const visible = !query || text.indexOf(query) !== -1 || option.value === select.value;
        option.hidden = !visible;
        option.disabled = !visible;
        if (visible) visibleCount++;
      });
      const countId = input.getAttribute('data-match-count');
      const count = countId ? document.getElementById(countId) : null;
      if (count) count.textContent = query ? ('พบ ' + visibleCount + ' รายการ') : '';
    },

    clearSelectFilters() {
      document.querySelectorAll('[data-select-filter]').forEach((input) => {
        input.value = '';
        this.applySelectFilter(input);
      });
    },

    syncMobileNavigation(name) {
      const primaryTabs = ['dashboard', 'myRequests', 'newRequest', 'reports'];
      document.querySelectorAll('[data-mobile-tab]').forEach((node) => {
        const active = node.getAttribute('data-mobile-tab') === name;
        node.classList.toggle('active', active);
        if (active) node.setAttribute('aria-current', 'page');
        else node.removeAttribute('aria-current');
      });
      const more = document.getElementById('mobileNavMore');
      if (more) {
        const moreActive = primaryTabs.indexOf(name) === -1;
        more.classList.toggle('active', moreActive);
        if (moreActive) more.setAttribute('aria-current', 'page');
        else more.removeAttribute('aria-current');
      }
    },

    showTab(name, refresh = true) {
      const tabs = ['dashboard', 'newRequest', 'myRequests', 'reports', 'data', 'settings', 'profile', 'registrations'];
      tabs.forEach((tab) => {
        const panel = document.getElementById(tab + 'Tab');
        if (panel) panel.classList.toggle('hidden', tab !== name);
      });

      const navMap = {
        dashboard: 'navDashboard',
        newRequest: 'navNewRequest',
        myRequests: 'navMyRequests',
        reports: 'navReports',
        data: 'navData',
        settings: 'navSettings',
        profile: 'navProfile',
        registrations: 'navRegistrations'
      };
      Object.keys(navMap).forEach((tab) => {
        const nav = document.getElementById(navMap[tab]);
        if (!nav) return;
        const isActive = tab === name || (name === 'registrations' && tab === 'data');
        nav.classList.toggle('active', isActive);
        if (isActive) nav.setAttribute('aria-current', 'page');
        else nav.removeAttribute('aria-current');
      });
      this.syncMobileNavigation(name);

      if (refresh) {
        if (name === 'dashboard' && this.shouldRefreshTab('dashboard')) this.loadDashboard();
        if (name === 'myRequests') this.loadRequests();
        if (name === 'profile' && this.shouldRefreshTab('profile')) this.loadProfile();
        if (name === 'registrations' && this.shouldRefreshTab('registrations')) this.loadRegistrations();
      }
      if (name === 'reports') this.loadReports();
      if (name === 'data') this.renderDataManagement();
      if (name === 'settings') this.applyTheme(document.documentElement.getAttribute('data-theme') || 'light', false);
      this.toggleSidebar(false);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    shouldRefreshTab(name) {
      if (name === 'myRequests' && !this.requestsLoaded) return true;
      const last = Number(this.lastLoaded[name] || 0);
      return !last || (Date.now() - last) > this.cacheTtlMs;
    },

    invalidateTabs() {
      const names = Array.prototype.slice.call(arguments);
      names.forEach((name) => { this.lastLoaded[name] = 0; });
    },

    capitalize(text) {
      return text.charAt(0).toUpperCase() + text.slice(1);
    },

    async loadProfile(showLoader = true) {
      if (showLoader) this.showLoading(true);
      try {
        const results = await Promise.all([
          this.ensurePublicRegistrationData().catch((err) => {
            console.warn('PROFILE_PUBLIC_CONFIG', err);
            return null;
          }),
          this.serverCall((runner) => runner.apiGetLinkedIdentities(this.token))
        ]);
        const res = results[1];
        if (!res || !res.ok) {
          this.handleApiError(res);
          return;
        }
        this.identities = res.data || [];
        this.renderProfile();
        this.lastLoaded.profile = Date.now();
      } catch (err) {
        this.notify((err && err.message) || 'โหลดข้อมูลบัญชีไม่สำเร็จ', 'error');
      } finally {
        if (showLoader) this.showLoading(false);
