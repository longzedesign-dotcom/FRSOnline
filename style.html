<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --danger: #dc2626;
    --warning: #d97706;
    --success: #15803d;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  button, input, select, textarea { font: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 3px solid rgba(37, 99, 235, .25);
    outline-offset: 2px;
  }

  .hidden { display: none !important; }
  .page { min-height: 100vh; }
  .muted { color: var(--muted); }

  .page-login {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 18px;
    background: radial-gradient(circle at top, #e0edff 0, #f4f7fb 42%, #eef2f7 100%);
  }

  .auth-shell { width: 100%; max-width: 480px; }
  .login-card {
    width: 100%;
    background: var(--card);
    border: 1px solid rgba(226, 232, 240, .9);
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 18px 50px rgba(15, 23, 42, .12);
  }
  .auth-panel-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
  .auth-panel-header h1 { text-align: left; margin: 0 0 4px; font-size: 24px; }
  .auth-panel-header .muted { text-align: left; margin: 0; }
  .back-button { border: 0; width: 38px; height: 38px; border-radius: 12px; background: #f1f5f9; color: #334155; font-size: 22px; cursor: pointer; }
  .social-login-stack { display: grid; gap: 11px; margin: 20px 0; }
  .social-button { width: 100%; min-height: 48px; border-radius: 13px; border: 1px solid var(--border); background: #fff; color: #1f2937; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; cursor: pointer; }
  .social-button:disabled { opacity: .55; cursor: not-allowed; }
  .line-button { background: #06c755; color: #fff; border-color: #06c755; }
  .social-mark { display: inline-grid; place-items: center; flex: 0 0 auto; }
  .google-mark { width: 25px; height: 25px; border-radius: 50%; background: conic-gradient(from -45deg,#4285f4 0 25%,#34a853 0 50%,#fbbc05 0 75%,#ea4335 0); color: #fff; border: 3px solid #fff; box-shadow: 0 0 0 1px #e2e8f0; font-size: 12px; font-weight: 900; }
  .line-mark { min-width: 34px; height: 24px; padding: 0 5px; border-radius: 8px; background: #fff; color: #06a944; font-size: 9px; font-weight: 900; }
  .auth-divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; margin: 4px 0; }
  .auth-divider::before, .auth-divider::after { content: ''; height: 1px; background: var(--border); flex: 1; }
  .auth-footer { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); text-align: center; font-weight: 700; }
  .text-button { border: 0; background: transparent; color: var(--primary); font-weight: 900; cursor: pointer; padding: 4px; }
  .consent-row { display: flex; align-items: flex-start; gap: 10px; margin: 16px 0; font-size: 13px; line-height: 1.5; font-weight: 600; }
  .consent-row input { width: 18px; height: 18px; margin-top: 2px; flex: 0 0 auto; }
  .honeypot { position: absolute !important; left: -10000px !important; width: 1px !important; height: 1px !important; opacity: 0 !important; }
  .social-profile-card { display: flex; gap: 12px; align-items: center; background: #f8fafc; border: 1px solid var(--border); border-radius: 16px; padding: 13px; margin-bottom: 18px; }
  .social-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #e2e8f0; }
  .social-avatar-placeholder { display: grid; place-items: center; font-weight: 900; color: #475569; }

  .brand-icon { font-size: 44px; text-align: center; }
  h1 { text-align: center; margin: 8px 0 4px; font-size: 28px; }
  .login-card .muted { text-align: center; margin-top: 0; }
  .version-text { margin-top: 18px; text-align: center; color: var(--muted); font-size: 12px; }
  .security-note {
    margin-top: 16px;
    padding: 11px 12px;
    border-radius: 12px;
    background: #f8fafc;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
  }

  .form-group { margin-bottom: 16px; }
  label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 14px; }
  input, select, textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px 14px;
    font-size: 16px;
    background: #fff;
    outline: none;
  }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
  }

  .field-help { color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 7px; }
  .required { color: var(--danger); }

  .btn {
    border: 0;
    border-radius: 14px;
    padding: 13px 17px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:active { background: var(--primary-dark); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-warning { background: #f59e0b; color: #111827; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-light { background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe; }
  .btn-outline { background: #fff; color: var(--primary); border: 1px solid #93c5fd; }
  .btn-full { width: 100%; }
  .btn-small { padding: 9px 12px; font-size: 13px; }

  .btn-icon {
    border: 1px solid rgba(255, 255, 255, .45);
    background: rgba(255, 255, 255, .18);
    color: #fff;
    border-radius: 999px;
    padding: 8px 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #fff;
    padding: 18px 16px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom-left-radius: 22px;
    border-bottom-right-radius: 22px;
    box-shadow: 0 8px 28px rgba(37, 99, 235, .25);
  }

  .app-title { font-size: 20px; font-weight: 800; }
  .app-version { font-size: 11px; font-weight: 600; opacity: .8; }
  .user-text { font-size: 13px; opacity: .9; margin-top: 2px; }

  .content { padding: 16px 16px 92px; max-width: 960px; margin: 0 auto; }
  .section-title { font-size: 18px; font-weight: 900; margin: 8px 0 14px; }
  .section-header-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .mt { margin-top: 22px; }

  .grid-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .stat-card {
    background: var(--card);
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 6px 22px rgba(15, 23, 42, .06);
    border: 1px solid var(--border);
  }
  .stat-card span { display: block; font-size: 32px; font-weight: 900; color: var(--primary); }
  .stat-card small { color: var(--muted); font-weight: 700; }

  .card-form, .action-card, .detail-card {
    background: var(--card);
    border-radius: 20px;
    padding: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 6px 22px rgba(15, 23, 42, .06);
  }
  .action-card { margin-top: 14px; }
  .action-title { font-weight: 900; margin-bottom: 12px; }
  .action-grid { display: grid; gap: 10px; grid-template-columns: 1fr; }
  .button-row { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 10px; }

  .filter-bar {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .request-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px;
    box-shadow: 0 4px 18px rgba(15, 23, 42, .05);
  }
  .request-card.clickable { cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
  .request-card.clickable:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(15, 23, 42, .09); }
  .request-card-header { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; align-items: flex-start; }
  .request-id { font-weight: 900; color: var(--primary); overflow-wrap: anywhere; }
  .request-detail { color: var(--text); font-weight: 700; margin-bottom: 8px; overflow-wrap: anywhere; }
  .request-meta { color: var(--muted); font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
  .request-assignee { margin-top: 8px; font-size: 13px; font-weight: 800; color: #334155; }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 5px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    background: #e0f2fe;
    color: #0369a1;
    white-space: nowrap;
  }
  .badge.NEW { background: #fef3c7; color: #92400e; }
  .badge.IN_PROGRESS, .badge.ASSIGNED, .badge.RECEIVED { background: #dbeafe; color: #1d4ed8; }
  .badge.WAITING_PART, .badge.OUTSOURCE { background: #ffedd5; color: #9a3412; }
  .badge.DONE, .badge.CLOSED { background: #dcfce7; color: #166534; }
  .badge.CANCELLED { background: #fee2e2; color: #991b1b; }

  /* FRS v2.0.5 - Responsive floating navigation */
  .bottom-nav {
    --nav-max-width: 860px;
    --nav-fab-size: clamp(64px, 8vw, 78px);
    --nav-icon-size: clamp(24px, 2.7vw, 29px);
    position: fixed;
    left: 50%;
    right: auto;
    bottom: max(10px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 40;
    width: min(var(--nav-max-width), calc(100% - 24px));
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    align-items: end;
    min-height: clamp(82px, 9vw, 94px);
    padding: clamp(12px, 1.5vw, 16px) clamp(8px, 1.5vw, 16px) max(8px, env(safe-area-inset-bottom));
    background: rgba(255,255,255,.95);
    border: 1px solid rgba(191,219,254,.92);
    border-radius: clamp(24px, 3vw, 34px);
    box-shadow: 0 16px 36px rgba(30,64,175,.14), 0 4px 12px rgba(15,23,42,.07);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    overflow: visible;
    isolation: isolate;
  }
  .bottom-nav::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(239,248,255,.62));
  }
  .bottom-nav .nav-item {
    position: relative;
    min-width: 0;
    height: clamp(58px, 7vw, 66px);
    border: 0;
    border-radius: clamp(16px, 2vw, 21px);
    background: transparent;
    color: #8294b2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 6px 3px 4px;
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .16s ease, color .16s ease, background .16s ease, box-shadow .16s ease;
    overflow: visible;
  }
  .bottom-nav .nav-item:active { transform: scale(.96); }
  .bottom-nav .nav-icon {
    width: var(--nav-icon-size);
    height: var(--nav-icon-size);
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    transition: transform .18s ease;
    overflow: visible;
  }
  .bottom-nav .nav-icon svg {
    width: 100%;
    height: 100%;
    display: block;
    fill: currentColor;
    overflow: visible;
  }
  .bottom-nav .nav-label {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: clamp(10px, 1.35vw, 12px);
    line-height: 1.2;
    font-weight: 800;
    letter-spacing: -.1px;
    text-align: center;
  }
  .bottom-nav .nav-active-dot {
    width: 18px;
    height: 3px;
    border-radius: 999px;
    background: transparent;
    transition: background .16s ease, width .16s ease;
  }
  .bottom-nav .nav-item.active:not(.nav-primary) {
    color: #0878f9;
    background: linear-gradient(145deg, rgba(224,242,254,.96), rgba(239,246,255,.75));
    box-shadow: inset 0 0 0 1px rgba(147,197,253,.30);
  }
  .bottom-nav .nav-item.active:not(.nav-primary) .nav-icon { transform: translateY(-1px); }
  .bottom-nav .nav-item.active:not(.nav-primary) .nav-active-dot {
    width: 24px;
    background: linear-gradient(90deg,#1683ff,#46a6ff);
  }
  .bottom-nav .nav-primary {
    align-self: start;
    height: calc(var(--nav-fab-size) + 28px);
    margin-top: calc(var(--nav-fab-size) * -.38);
    color: #147cf3;
    overflow: visible;
    background: transparent !important;
  }
  .bottom-nav .nav-primary-orbit {
    position: absolute;
    top: 0;
    left: 50%;
    width: calc(var(--nav-fab-size) + 10px);
    height: calc(var(--nav-fab-size) + 10px);
    transform: translateX(-50%);
    border-radius: 50%;
    background: rgba(219,234,254,.78);
    box-shadow: 0 9px 24px rgba(37,99,235,.20);
    pointer-events: none;
  }
  .bottom-nav .nav-icon-primary {
    position: relative;
    z-index: 1;
    width: var(--nav-fab-size);
    height: var(--nav-fab-size);
    margin: 0;
    padding: clamp(16px, 2vw, 20px);
    color: #fff;
    border-radius: 50%;
    background: linear-gradient(145deg,#2e98ff 0%,#0668e8 72%,#0758c8 100%);
    border: 4px solid #eff7ff;
    box-shadow: 0 10px 24px rgba(8,104,232,.30), inset 0 1px 1px rgba(255,255,255,.38);
    box-sizing: border-box;
    overflow: visible;
  }
  .bottom-nav .nav-icon-primary svg {
    fill: none;
    stroke: currentColor;
    stroke-width: 2.15;
    stroke-linecap: round;
    stroke-linejoin: round;
    overflow: visible;
  }
  .bottom-nav .nav-primary .nav-label {
    margin-top: 5px;
    color: #147cf3;
    font-size: clamp(10px, 1.3vw, 12px);
    overflow: visible;
  }
  .bottom-nav .nav-primary.active .nav-icon-primary {
    background: linear-gradient(145deg,#1683ff,#075dd5);
    box-shadow: 0 12px 28px rgba(8,104,232,.38), 0 0 0 6px rgba(191,219,254,.38);
  }
  .bottom-nav .nav-unavailable {
    visibility: hidden;
    pointer-events: none;
  }
  @media (hover:hover) {
    .bottom-nav .nav-item:hover:not(.nav-unavailable) { color: #1683ff; background: rgba(239,246,255,.82); }
    .bottom-nav .nav-primary:hover { background: transparent; transform: translateY(-1px); }
  }
  @media (max-width: 479px) {
    .bottom-nav {
      --nav-fab-size: 66px;
      width: calc(100% - 14px);
      min-height: 82px;
      padding-left: 5px;
      padding-right: 5px;
      gap: 0;
      border-radius: 26px;
    }
    .bottom-nav .nav-item { padding-left: 1px; padding-right: 1px; }
    .bottom-nav .nav-label { font-size: 10px; }
  }
  @media (min-width: 480px) and (max-width: 899px) {
    .bottom-nav { width: min(94vw, 760px); }
  }
  @media (min-width: 900px) {
    .bottom-nav { width: min(860px, 72vw); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bottom-nav .nav-item,
    .bottom-nav .nav-icon,
    .bottom-nav .nav-active-dot { transition: none; }
  }

  .photo-preview {
    margin-top: 10px;
    height: 180px;
    border-radius: 16px;
    background-size: cover;
    background-position: center;
    border: 1px solid var(--border);
  }


  .identity-list { display: grid; gap: 10px; }
  .identity-card { background: #fff; border: 1px solid var(--border); border-radius: 17px; padding: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .identity-provider { font-weight: 900; }
  .identity-meta { color: var(--muted); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
  .provider-badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 5px 9px; background: #eef2ff; color: #3730a3; font-size: 11px; font-weight: 900; }
  .provider-badge.LINE { background: #dcfce7; color: #15803d; }
  .provider-badge.GOOGLE { background: #fef3c7; color: #92400e; }
  .registration-card { background: #fff; border: 1px solid var(--border); border-radius: 18px; padding: 15px; }
  .registration-card-header { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .registration-name { font-size: 16px; font-weight: 900; }
  .registration-details { display: grid; grid-template-columns: 1fr; gap: 5px; margin-top: 10px; color: #475569; font-size: 13px; line-height: 1.45; }
  .info-banner { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; font-size: 13px; font-weight: 700; }

  .modal { position: fixed; inset: 0; z-index: 100; }
  .modal-backdrop { position: absolute; inset: 0; background: rgba(15, 23, 42, .58); }
  .modal-panel {
    position: absolute;
    inset: 2vh 0 0;
    margin: auto;
    width: 100%;
    max-width: 820px;
    background: var(--bg);
    border-radius: 24px 24px 0 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .modal-title { font-size: 19px; font-weight: 900; color: var(--primary); }
  .modal-subtitle { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .modal-close {
    border: 0;
    background: #e2e8f0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 25px;
    line-height: 1;
    cursor: pointer;
  }
  .modal-body { overflow-y: auto; padding: 14px 14px 40px; }

  .detail-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .detail-grid > div { padding: 11px 12px; background: #f8fafc; border: 1px solid #eef2f7; border-radius: 12px; }
  .detail-grid > div > span { display: block; color: var(--muted); font-size: 11px; font-weight: 800; margin-bottom: 4px; }
  .detail-grid > div > strong { display: block; font-size: 14px; overflow-wrap: anywhere; }
  .empty-state { padding: 22px 16px; border: 1px dashed #cbd5e1; border-radius: 16px; text-align: center; color: var(--muted); background: rgba(255,255,255,.65); }
  .detail-item { padding: 10px 12px; background: #f8fafc; border-radius: 12px; border: 1px solid #eef2f7; }
  .detail-label { display: block; font-size: 11px; color: var(--muted); font-weight: 800; margin-bottom: 4px; }
  .detail-value { font-size: 14px; font-weight: 700; overflow-wrap: anywhere; white-space: pre-wrap; }
  .photo-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .photo-link { text-decoration: none; color: var(--primary); background: #eff6ff; border: 1px solid #bfdbfe; padding: 8px 11px; border-radius: 10px; font-weight: 800; font-size: 13px; }

  .timeline { display: flex; flex-direction: column; gap: 10px; }
  .timeline-item { position: relative; padding: 12px 13px 12px 18px; border-left: 4px solid #93c5fd; background: #fff; border-radius: 0 14px 14px 0; }
  .timeline-title { font-weight: 900; }
  .timeline-meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .timeline-note { margin-top: 6px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }

  .loading {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, .42);
    z-index: 999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    gap: 12px;
  }
  .spinner {
    width: 42px;
    height: 42px;
    border: 4px solid rgba(255, 255, 255, .35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 118px;
    z-index: 1000;
    background: #111827;
    color: #fff;
    padding: 13px 16px;
    border-radius: 14px;
    text-align: center;
    font-weight: 700;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .22);
  }

  @media (min-width: 640px) {
    .filter-bar { grid-template-columns: 2fr 1fr; }
    .detail-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .action-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (min-width: 720px) {
    .grid-cards { grid-template-columns: repeat(4, 1fr); }
    .modal-panel { inset: 3vh 18px; border-radius: 24px; max-height: 94vh; }
  }


  /* Minimal Message Box — FRS v2.0.2 */
  .msgbox {
    position: fixed;
    inset: 0;
    z-index: 1400;
    display: grid;
    place-items: center;
    padding: 20px;
  }
  .msgbox-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, .46);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);

  /* FRS Progress UX v2.0.3 */

  .frs-progress-overview.frs-tone-done, .frs-progress-overview.frs-tone-closed { --progress-accent: #10b981; background: linear-gradient(145deg, #f0fdf9, #ecfdf5); border-color: #bbf7d0; }
  .frs-progress-overview.frs-tone-cancelled { --progress-accent: #ef4444; background: #fff7f7; border-color: #fecaca; }
  .frs-progress-overview__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 12px; }
  .frs-progress-eyebrow { color: #64748b; font-size: 12px; font-weight: 800; }

  .frs-steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; margin-top: 24px; }
  .frs-step { position: relative; min-width: 0; text-align: center; z-index: 1; }
  .frs-step__node { width: 38px; height: 38px; margin: 0 auto; display: grid; place-items: center; border-radius: 999px; border: 2px solid #bfdbfe; background: #fff; color: #60a5fa; font-weight: 950; position: relative; z-index: 2; }
  .frs-step__connector { position: absolute; top: 18px; left: calc(50% + 19px); width: calc(100% - 38px); height: 3px; background: #dbeafe; z-index: 0; }
  .frs-step__label { margin-top: 8px; color: #64748b; font-size: 11px; line-height: 1.25; font-weight: 800; }
  .frs-step--completed .frs-step__node { color: #fff; background: var(--progress-accent); border-color: var(--progress-accent); }
  .frs-step--completed .frs-step__connector { background: var(--progress-accent); }

  .frs-step--active .frs-step__node { color: #fff; background: var(--progress-accent); border-color: #fff; box-shadow: 0 0 0 4px #93c5fd, 0 0 0 7px #fff; }
  .frs-step--active .frs-step__label { color: var(--progress-accent); font-weight: 950; }
  .frs-step--cancelled .frs-step__node { background: #ef4444; color: #fff; border-color: #ef4444; }

  .frs-subprogress { display: grid; gap: 10px; margin-top: 22px; padding: 14px; background: rgba(255,255,255,.72); border-radius: 16px; border: 1px solid rgba(148,163,184,.18); }

  .frs-subprogress__row strong { text-align: right; color: var(--progress-accent); }

  @media (max-width: 520px) {

    .frs-step__node { width: 31px; height: 31px; font-size: 12px; }

:root {

    width: var(--nav-icon-size) !important;
    height: var(--nav-icon-size) !important;
    margin: 0 !important;
    padding: 0 !important;
    color: currentColor !important;
    border: 0 !important;
    border-radius: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
    box-sizing: border-box;

  .bottom-nav .nav-icon svg,
  .bottom-nav .nav-icon-primary svg {
    width: 100%;
    height: 100%;
    display: block;
    fill: currentColor;
    stroke: none;
  }

  .bottom-nav .nav-primary .nav-label,
  .bottom-nav .nav-label {
    margin-top: 0 !important;
    color: currentColor !important;
    font-size: clamp(10px, 1.35vw, 12px);

  .bottom-nav .nav-item.active,

  .select-search-wrap {
    position: relative;
    margin-bottom: 8px;
  }

  .select-search-input {
    width: 100%;
    padding-right: 86px !important;
    background: #f8fbff !important;
    border-style: dashed !important;

    background: #fff !important;

  }

  .select-match-count {
    position: absolute;
    right: 12px;

    font-size: 11px;
    pointer-events: none;
    white-space: nowrap;
  }

  .btn[disabled],
  .btn.is-busy {
    cursor: wait;
    opacity: .72;
    transform: none !important;
    box-shadow: none !important;
  }

  .btn.is-busy::before {
    content: '';
    display: inline-block;
    width: 14px;
    height: 14px;
    margin-right: 8px;
    vertical-align: -2px;
    border: 2px solid rgba(255,255,255,.45);
    border-top-color: currentColor;
    border-radius: 50%;
    animation: frs-spin .72s linear infinite;
  }

  @keyframes frs-spin {
    to { transform: rotate(360deg); }
  }

  .panel-loading {
    position: relative;
  }

  .skeleton-card {
    position: relative;
    overflow: hidden;
    min-height: 94px;
    border: 1px solid #e7edf6;
    border-radius: 16px;
    background: #fff;
    margin-bottom: 12px;
    padding: 16px;
  }

  .skeleton-card::after,
  .skeleton-line::after {
    content: '';
    position: absolute;
    inset: 0;
    transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent);
    animation: frs-shimmer 1.2s infinite;
  }

  .skeleton-line {
    position: relative;
    overflow: hidden;
    height: 12px;
    border-radius: 999px;
    background: #edf2f8;
    margin-bottom: 11px;
  }

  .skeleton-line.short { width: 38%; }
  .skeleton-line.medium { width: 68%; }
  .skeleton-line:last-child { margin-bottom: 0; }

  @keyframes frs-shimmer {
    100% { transform: translateX(100%); }
  }
